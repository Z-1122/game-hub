<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游戏小屋</title>
<meta name="description" content="自己写的小游戏合集" />
<style>
  :root {
    color-scheme: dark;
    --bg: #05070e;
    --panel: rgba(255, 255, 255, 0.035);
    --panel-hover: rgba(255, 255, 255, 0.06);
    --line: rgba(120, 200, 255, 0.12);
    --text: #e8f4ff;
    --muted: rgba(150, 190, 220, 0.62);
    --accent: #5ff0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(40, 110, 170, 0.20) 0%, transparent 55%),
      radial-gradient(circle at 85% 15%, rgba(120, 90, 200, 0.16) 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 背景网格 */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(96, 168, 224, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96, 168, 224, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  }

  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 56px 24px 72px; }

  /* ---- 头部 ---- */
  header { margin-bottom: 48px; }
  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--accent); opacity: 0.7; margin-bottom: 20px;
  }
  .brand::before {
    content: ""; width: 26px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  h1 {
    font-size: clamp(38px, 6vw, 60px);
    font-weight: 800; line-height: 1.08; letter-spacing: -0.01em;
    text-shadow: 0 0 42px rgba(95, 240, 255, 0.34);
  }
  h1 .glow {
    background: linear-gradient(120deg, #5ff0ff 10%, #a98bff 90%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { margin-top: 14px; font-size: 15px; color: var(--muted); }

  .stats {
    display: flex; gap: 28px; margin-top: 26px; flex-wrap: wrap;
    font-size: 13px; color: var(--muted);
  }
  .stats b { color: var(--text); font-weight: 700; font-size: 17px; margin-right: 5px; }

  /* ---- 游戏卡片 ---- */
  .grid {
    display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }

  .card {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px; padding: 26px 24px 22px;
    transition: transform .22s cubic-bezier(.2,.8,.3,1), border-color .22s, background .22s, box-shadow .22s;
    overflow: hidden;
  }
  /* 顶部高光条 */
  .card::before {
    content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--c1), var(--c2), transparent);
    opacity: 0.5; transition: opacity .22s;
  }
  /* 悬浮光晕 */
  .card::after {
    content: ""; position: absolute; inset: -1px; border-radius: 16px; pointer-events: none;
    background: radial-gradient(circle at 50% 0%, var(--c1), transparent 62%);
    opacity: 0; transition: opacity .25s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-5px);
    background: var(--panel-hover);
    border-color: color-mix(in srgb, var(--c1) 45%, transparent);
    box-shadow: 0 20px 50px -22px var(--c1);
    outline: none;
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; }
  .card:hover::after, .card:focus-visible::after { opacity: 0.11; }

  .card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .icon {
    flex: none; width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center; font-size: 22px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #05070e; font-weight: 700;
    box-shadow: 0 0 26px -6px var(--c1);
  }
  .card h2 { font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
  .card .tagline { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .card p.desc {
    font-size: 13.5px; line-height: 1.72; color: rgba(196, 220, 238, 0.76);
    margin-bottom: 18px;
  }

  .tags { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
  .tag {
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    color: color-mix(in srgb, var(--c1) 85%, #fff);
    background: color-mix(in srgb, var(--c1) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--c1) 28%, transparent);
  }

  .controls {
    font-size: 11.5px; color: var(--muted);
    padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .controls span.k {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    color: rgba(200, 228, 245, 0.8);
  }

  .play-hint {
    position: absolute; right: 22px; bottom: 20px;
    font-size: 12px; font-weight: 600;
    color: var(--c1); opacity: 0;
    transform: translateX(-6px);
    transition: opacity .22s, transform .22s;
  }
  .card:hover .play-hint, .card:focus-visible .play-hint { opacity: 1; transform: translateX(0); }

  code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12.5px; padding: 2px 7px; border-radius: 5px;
    background: rgba(120, 200, 255, 0.10);
    color: #9fe8ff; border: 1px solid rgba(120, 200, 255, 0.16);
  }

  footer {
    margin-top: 56px; padding-top: 26px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 14px;
    font-size: 12.5px; color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; opacity: 0.85; }
  footer a:hover { opacity: 1; text-decoration: underline; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  /* ---- 入场动画 ---- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim { animation: rise .5s cubic-bezier(.2,.8,.3,1) backwards; }

  @media (max-width: 560px) {
    .wrap { padding: 36px 18px 56px; }
    header { margin-bottom: 34px; }
    .grid { grid-template-columns: 1fr; }
    .stats { gap: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="wrap">
  <header>
    <div class="brand">Game Hub</div>
    <h1 id="siteTitle">游戏<span class="glow">小屋</span></h1>
    <p class="sub" id="siteSubtitle">自己写的小游戏，都放在这里</p>
    <div class="stats" id="stats"></div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      还没有游戏。
    </div>

  </main>

  <footer>
    <span id="footerText"></span>
    <a id="footerLink" href="#" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var stats = document.getElementById('stats');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function makeCard(game, index) {
    var a = document.createElement('a');
    a.className = 'card anim';
    a.href = game.file || '#';
    a.style.animationDelay = (index * 70) + 'ms';
    a.style.setProperty('--c1', game.accent || '#5ff0ff');
    a.style.setProperty('--c2', game.accent2 || '#a98bff');

    var tags = (game.tags || []).map(function (t) {
      return '<span class="tag">' + esc(t) + '</span>';
    }).join('');

    var ctrl = game.controls
      ? '<div class="controls"><span class="k">' + esc(game.controls) + '</span></div>'
      : '';

    a.innerHTML =
      '<div class="card-top">' +
        '<div class="icon">' + esc(game.icon || '▶') + '</div>' +
        '<div>' +
          '<h2>' + esc(game.name) + '</h2>' +
          '<div class="tagline">' + esc(game.tagline || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<p class="desc">' + esc(game.description || '') + '</p>' +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      ctrl +
      '<span class="play-hint">开始玩 →</span>';

    return a;
  }

  function render(data) {
    var site = data.site || {};
    // 按日期从新到旧排，顺序由 games.json 里的 date 决定
    var games = (data.games || []).slice().sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    if (site.title) {
      document.getElementById('siteTitle').innerHTML =
        esc(site.title.slice(0, -2)) + '<span class="glow">' + esc(site.title.slice(-2)) + '</span>';
      document.title = site.title;
    }
    if (site.subtitle) document.getElementById('siteSubtitle').textContent = site.subtitle;
    if (site.author) {
      document.getElementById('footerText').textContent =
        '© ' + new Date().getFullYear() + ' ' + site.author + ' · 共 ' + games.length + ' 个游戏';
    }
    if (site.github) {
      var fl = document.getElementById('footerLink');
      fl.href = site.github;
    }

    stats.innerHTML =
      '<div><b>' + games.length + '</b>个游戏</div>' +
      '<div><b>' + new Set(games.reduce(function (acc, g) {
        return acc.concat(g.tags || []);
      }, [])).size + '</b>种标签</div>';

    grid.innerHTML = '';
    if (!games.length) { empty.hidden = false; return; }
    empty.hidden = true;
    games.forEach(function (g, i) { grid.appendChild(makeCard(g, i)); });
  }

  fetch('games.json', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      empty.hidden = false;
      empty.innerHTML =
        '读取 <code>games.json</code> 失败：' + esc(err.message) +
        '<br><br><span style="font-size:12px;opacity:.7">' +
        '如果你是直接双击打开这个文件（file:// 协议），浏览器会拦截读取，' +
        '请改用本地服务器或访问线上地址。</span>';
    });
})();
</script>
</body>
</html>
