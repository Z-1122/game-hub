<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>深渊回响</title>
<style>
  :root{
    --bg:#05070d; --panel:#0b1220; --line:rgba(255,255,255,.08);
    --text:#dfe7f5; --dim:#7686a3; --cyan:#4fd1c5; --red:#ff4d6a; --violet:#a78bfa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:radial-gradient(1000px 760px at 50% -25%,#101c33 0%,var(--bg) 62%);
    color:var(--text);font-family:"Consolas","Cascadia Mono",ui-monospace,"Microsoft YaHei",monospace;
    display:flex;justify-content:center;align-items:flex-start;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    overflow:hidden;touch-action:none;
  }
  .wrap{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:6px;}

  .hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;}
  .hpwrap{position:relative;flex:1;min-width:120px;max-width:280px;height:13px;
    background:#1a2334;border-radius:7px;overflow:hidden;border:1px solid var(--line);}
  .hpwrap i{position:absolute;inset:0;width:100%;
    background:linear-gradient(90deg,#ff4d6a,#ff8a5b);transition:width .12s;}
  .hpwrap span{position:absolute;inset:0;text-align:center;line-height:13px;font-size:10px;
    color:#fff;text-shadow:0 1px 2px #000;}
  .stat{color:var(--dim);white-space:nowrap;}
  .stat b{color:var(--cyan);font-weight:700;}
  .sp{flex:1;}
  .dashwrap{position:relative;width:64px;height:8px;background:#1a2334;border-radius:4px;overflow:hidden;}
  .dashwrap i{position:absolute;inset:0;width:100%;background:var(--violet);transition:width .08s;}

  .stage{position:relative;border-radius:12px;border:1px solid var(--line);background:#04060b;overflow:visible;}
  canvas{display:block;border-radius:12px;touch-action:none;}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;text-align:center;padding:18px;
    background:rgba(3,5,10,.9);border-radius:12px;}
  .overlay.hide{display:none;}
  .overlay h2{margin:0;font-size:24px;letter-spacing:.16em;}
  .overlay p{margin:0;font-size:12.5px;line-height:1.85;color:var(--dim);max-width:430px;}
  .overlay p b{color:#ffd166;}
  .overlay button{font:inherit;font-weight:700;letter-spacing:.14em;color:#04120f;
    background:linear-gradient(180deg,#7ff3dc,#31c6ae);border:0;border-radius:999px;
    padding:10px 30px;cursor:pointer;}
  .overlay button:active{transform:translateY(1px);}

  .foot{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--dim);line-height:1.7;}
  .foot .grow{flex:1;}

  .touch{display:none;align-items:center;justify-content:space-between;gap:14px;padding:2px 4px 0;}
  .stick{position:relative;width:104px;height:104px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.03);}
  .stick i{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;
    border-radius:50%;background:rgba(79,209,197,.28);border:1px solid rgba(79,209,197,.55);}
  .btns{display:flex;gap:12px;}
  .btns button{width:74px;height:74px;border-radius:50%;font:inherit;font-size:13px;
    color:var(--text);background:rgba(255,255,255,.055);border:1px solid var(--line);cursor:pointer;}
  .btns button.dash{color:#c9b8ff;border-color:rgba(167,139,250,.45);}
  .btns button.atk{color:#8ff0e3;border-color:rgba(79,209,197,.5);}
  .btns button:active{background:rgba(255,255,255,.14);}

  @media (max-width:820px){
    .foot{display:none;}
    .touch{display:flex;}
  }
</style>

<style data-hub-nav="css">
  #hub-nav {
    position: fixed; top: 14px; left: 14px; z-index: 2147483000;
    display: inline-flex; align-items: center; gap: 7px;

<a id="hub-nav" href="../index.html" title="返回游戏小屋" aria-label="返回游戏小屋">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

<div class="wrap">
  <div class="hud">
    <span class="stat">HP</span>
    <div class="hpwrap"><i id="hpFill"></i><span id="hpText">100/100</span></div>
    <span class="stat">波次 <b id="wave">0</b></span>
    <span class="stat">分数 <b id="score">0</b></span>
    <span class="sp"></span>
    <span class="stat">冲刺</span>
    <div class="dashwrap"><i id="dashFill"></i></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">深渊回响</h2>
      <p id="ovText">
        实时弹幕动作。没有回合，没有暂停，<b>一次贪刀就是一次死亡</b>。<br>
        WASD 移动 · <b>J / 鼠标左键</b>挥刀（自动朝最近的敌人） · <b>空格</b>冲刺（无敌帧）<br>
        撑过 5 波杂兵，然后杀掉深渊回响。
      </p>
      <button id="btn">进入深渊</button>
    </div>
  </div>

  <div class="foot">
    <span>WASD/方向键 移动　J 或鼠标左键 挥刀　空格 冲刺（0.28 秒无敌）　R 重开</span>
    <span class="grow"></span>
    <span id="perf"></span>
  </div>

  <div class="touch">
    <div class="stick" id="stick"><i id="knob"></i></div>
    <div class="btns">
      <button class="dash" id="btnDash">冲刺</button>
      <button class="atk" id="btnAtk">挥刀</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var W = 960, H = 600;
  var MARGIN = 22;

  var DASH_CD = 0.9, DASH_DUR = 0.15, DASH_SPEED = 760, DASH_INV = 0.28;
  var ATK_CD = 0.26, ATK_RANGE = 66, ATK_ARC = Math.PI * 0.78, ATK_DMG = 20;
  var HURT_INV = 0.72;
  var BULLET_CAP = 640;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var stage = document.querySelector('.stage');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var btn = document.getElementById('btn');
  var hpFill = document.getElementById('hpFill');
  var hpText = document.getElementById('hpText');
  var waveEl = document.getElementById('wave');
  var scoreEl = document.getElementById('score');
  var dashFill = document.getElementById('dashFill');
  var perfEl = document.getElementById('perf');

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function angDiff(a, b) {
    var d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // ---------- 状态 ----------

  var G = null;
  var paused = false;
  var scale = 1, dpr = 1;
  var lastFrame = 0;

  var input = { up: false, down: false, left: false, right: false, attack: false, dash: false };
  var stickVec = { x: 0, y: 0 };

  var ENEMY_DEFS = {
    grunt:   { hp: 34,  speed: 108, r: 13, color: '#ff8f5a', dmg: 10, score: 10, name: '游荡者' },
    charger: { hp: 46,  speed: 74,  r: 14, color: '#ff4d6a', dmg: 16, score: 16, name: '突进者' },
    shooter: { hp: 30,  speed: 86,  r: 12, color: '#a78bfa', dmg: 8,  score: 18, name: '咏唱者' },
    spinner: { hp: 56,  speed: 62,  r: 15, color: '#7dd3fc', dmg: 10, score: 24, name: '回旋者' }
  };

  var WAVES = [
    ['grunt', 'grunt', 'grunt'],
    ['grunt', 'grunt', 'charger', 'grunt'],
    ['shooter', 'grunt', 'charger', 'grunt'],
    ['spinner', 'shooter', 'charger', 'grunt', 'grunt'],
    ['charger', 'shooter', 'spinner', 'grunt', 'shooter', 'charger']
  ];

  function emptyState() {
    return {
      phase: 'menu',
      time: 0,
      wave: 0,
      score: 0,
      clearT: 0,
      player: null,
      enemies: [],
      bullets: [],
      parts: [],
      orbs: [],
      boss: null,
      shake: 0,
      banner: '',
      bannerT: 0,
      deaths: 0
    };
  }

  function makePlayer() {
    return {
      x: W / 2, y: H / 2 + 90, r: 13,
      hp: 100, maxHp: 100,
      speed: 252,
      facing: -Math.PI / 2,
      atkCd: 0, swing: 0, swingAng: 0,
      dashCd: 0, dashT: 0, dashVX: 0, dashVY: 0,
      inv: 0, flash: 0
    };
  }

  function spawnEnemy(type, x, y) {
    var d = ENEMY_DEFS[type];
    if (!d) return null;
    var e = {
      type: type, x: x, y: y, r: d.r,
      hp: d.hp, maxHp: d.hp, speed: d.speed,
      color: d.color, dmg: d.dmg, score: d.score,
      state: 'idle', t: rnd(0, 1.2), cd: rnd(0.4, 1.4),
      vx: 0, vy: 0, flash: 0, aim: 0
    };
    G.enemies.push(e);
    return e;
  }

  function spawnPoint(minFromPlayer) {
    var p = G.player;
    for (var i = 0; i < 80; i++) {
      var x = rnd(MARGIN + 40, W - MARGIN - 40);
      var y = rnd(MARGIN + 40, H - MARGIN - 40);
      if (!p || dist2(x, y, p.x, p.y) > minFromPlayer * minFromPlayer) return { x: x, y: y };
    }
    return { x: W / 2, y: MARGIN + 60 };
  }

  function addBullet(x, y, vx, vy, opt) {
    if (G.bullets.length >= BULLET_CAP) return null;
    var b = {
      x: x, y: y, vx: vx, vy: vy,
      r: (opt && opt.r) || 6,
      dmg: (opt && opt.dmg) || 8,
      color: (opt && opt.color) || '#ff7a90',
      life: (opt && opt.life) || 6
    };
    G.bullets.push(b);
    return b;
  }

  function burstParts(x, y, color, n, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = rnd(power * 0.35, power);
      G.parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rnd(0.22, 0.55), max: 0.55, color: color, r: rnd(1.4, 3.2)
      });
    }
    if (G.parts.length > 460) G.parts.splice(0, G.parts.length - 460);
  }

  function banner(text, t) {
    G.banner = text;
    G.bannerT = t || 1.8;
  }

  // ---------- 玩家 ----------

  function nearestEnemy() {
    var p = G.player, best = null, bd = Infinity;
    for (var i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      var d = dist2(p.x, p.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (G.boss && (!best || dist2(p.x, p.y, G.boss.x, G.boss.y) < bd)) best = G.boss;
    return best;
  }

  function hurtPlayer(dmg) {
    var p = G.player;
    if (p.inv > 0 || p.dashT > 0 || G.phase !== 'playing') return false;
    p.hp -= dmg;
    p.inv = HURT_INV;
    p.flash = 0.22;
    G.shake = Math.max(G.shake, 7);
    burstParts(p.x, p.y, '#ff4d6a', 10, 260);
    if (p.hp <= 0) {
      p.hp = 0;
      G.phase = 'dead';
      burstParts(p.x, p.y, '#4fd1c5', 40, 380);
      showOverlay('深渊吞没了你', '你撑到了第 <b>' + Math.max(1, G.wave) + '</b> 波，得分 <b>' + G.score + '</b>。<br>弹幕不会手软，下一次记得先闪再砍。', '再来一次');
      return true;
    }
    return true;
  }

  function doAttack() {
    var p = G.player;
    var target = nearestEnemy();
    if (target) p.facing = Math.atan2(target.y - p.y, target.x - p.x);

    p.atkCd = ATK_CD;
    p.swing = 0.14;
    p.swingAng = p.facing;

    var hitAny = false;
    var list = G.enemies.slice();
    if (G.boss) list.push(G.boss);

    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e || e.hp <= 0) continue;
      var dx = e.x - p.x, dy = e.y - p.y;
      var dd = Math.sqrt(dx * dx + dy * dy);
      if (dd > ATK_RANGE + e.r) continue;
      var ang = Math.atan2(dy, dx);
      if (Math.abs(angDiff(ang, p.facing)) > ATK_ARC / 2) continue;

      var dmg = ATK_DMG + Math.round(rnd(-2, 3));
      e.hp -= dmg;
      e.flash = 0.12;
      hitAny = true;
      burstParts(e.x + dx * -0.3, e.y + dy * -0.3, '#ffe9a8', 5, 210);

      if (e.hp <= 0 && !e.boss) {
        G.score += e.score;
        burstParts(e.x, e.y, e.color, 14, 300);
        if (Math.random() < 0.17) {
          G.orbs.push({ x: e.x, y: e.y, r: 9, life: 14, t: 0 });
        }
      }
    }

    if (hitAny) G.shake = Math.max(G.shake, 3);
  }

  function updatePlayer(dt) {
    var p = G.player;
    p.atkCd = Math.max(0, p.atkCd - dt);
    p.dashCd = Math.max(0, p.dashCd - dt);
    p.inv = Math.max(0, p.inv - dt);
    p.flash = Math.max(0, p.flash - dt);
    p.swing = Math.max(0, p.swing - dt);
    p.dashT = Math.max(0, p.dashT - dt);

    var mx = 0, my = 0;
    if (input.left) mx -= 1;
    if (input.right) mx += 1;
    if (input.up) my -= 1;
    if (input.down) my += 1;
    if (stickVec.x || stickVec.y) { mx = stickVec.x; my = stickVec.y; }

    var len = Math.sqrt(mx * mx + my * my);
    if (len > 1) { mx /= len; my /= len; }

    if (input.dash && p.dashCd <= 0 && p.dashT <= 0) {
      var dx = mx, dy = my;
      if (!dx && !dy) {
        var t0 = nearestEnemy();
        if (t0) {
          var a0 = Math.atan2(t0.y - p.y, t0.x - p.x);
          dx = Math.cos(a0); dy = Math.sin(a0);
        } else { dx = 0; dy = -1; }
      }
      var l2 = Math.sqrt(dx * dx + dy * dy) || 1;
      p.dashVX = dx / l2; p.dashVY = dy / l2;
      p.dashT = DASH_DUR;
      p.dashCd = DASH_CD;
      p.inv = Math.max(p.inv, DASH_INV);
      burstParts(p.x, p.y, '#4fd1c5', 8, 200);
    }

    if (p.dashT > 0) {
      p.x += p.dashVX * DASH_SPEED * dt;
      p.y += p.dashVY * DASH_SPEED * dt;
    } else {
      p.x += mx * p.speed * dt;
      p.y += my * p.speed * dt;
      if (mx || my) p.facing = Math.atan2(my, mx);
    }

    p.x = clamp(p.x, MARGIN + p.r, W - MARGIN - p.r);
    p.y = clamp(p.y, MARGIN + p.r, H - MARGIN - p.r);

    if (targetLocked()) p.facing = Math.atan2(targetLocked().y - p.y, targetLocked().x - p.x);

    if (input.attack && p.atkCd <= 0) doAttack();
  }

  var _lockCache = null, _lockFrame = -1;
  function targetLocked() {
    if (_lockFrame !== G.time) {
      _lockCache = nearestEnemy();
      _lockFrame = G.time;
    }
    return _lockCache;
  }

  // ---------- 敌人 ----------

  function updateEnemies(dt) {
    var p = G.player;

    for (var i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (e.hp <= 0) continue;
      e.flash = Math.max(0, e.flash - dt);
      e.t += dt;

      var dx = p.x - e.x, dy = p.y - e.y;
      var dd = Math.sqrt(dx * dx + dy * dy) || 1;
      var ux = dx / dd, uy = dy / dd;

      if (e.type === 'grunt') {
        e.x += ux * e.speed * dt;
        e.y += uy * e.speed * dt;
        if (dd < e.r + p.r) hurtPlayer(e.dmg);
      } else if (e.type === 'charger') {
        if (e.state === 'idle') {
          e.x += ux * e.speed * dt * 0.7;
          e.y += uy * e.speed * dt * 0.7;
          if (dd < 330) { e.state = 'telegraph'; e.t = 0; e.aim = Math.atan2(dy, dx); }
          if (dd < e.r + p.r) hurtPlayer(e.dmg);
        } else if (e.state === 'telegraph') {
          e.aim = Math.atan2(dy, dx);
          if (e.t > 0.55) { e.state = 'dash'; e.t = 0; }
        } else if (e.state === 'dash') {
          e.x += Math.cos(e.aim) * 620 * dt;
          e.y += Math.sin(e.aim) * 620 * dt;
          if (dd < e.r + p.r + 4) hurtPlayer(e.dmg);
          if (e.t > 0.34) { e.state = 'recover'; e.t = 0; }
        } else {
          if (e.t > 0.55) { e.state = 'idle'; e.t = 0; }
        }
      } else if (e.type === 'shooter') {
        var want = 250;
        var push = dd < want - 30 ? -1 : (dd > want + 30 ? 1 : 0);
        e.x += ux * e.speed * dt * push;
        e.y += uy * e.speed * dt * push;
        e.x += Math.cos(e.t * 1.6) * 22 * dt;
        e.y += Math.sin(e.t * 1.6) * 22 * dt;
        e.cd -= dt;
        if (e.cd <= 0 && dd < 700) {
          e.cd = 1.55;
          var a = Math.atan2(dy, dx);
          for (var k = -1; k <= 1; k++) {
            var aa = a + k * 0.13;
            addBullet(e.x, e.y, Math.cos(aa) * 235, Math.sin(aa) * 235,
              { r: 6, dmg: 8, color: '#c4b5fd' });
          }
        }
        if (dd < e.r + p.r) hurtPlayer(e.dmg);
      } else if (e.type === 'spinner') {
        var cxp = W / 2 - e.x, cyp = H / 2 - e.y;
        e.x += cxp * 0.22 * dt + ux * e.speed * 0.34 * dt;
        e.y += cyp * 0.22 * dt + uy * e.speed * 0.34 * dt;
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = 2.25;
          var n = 10, base = e.t * 0.9;
          for (var s = 0; s < n; s++) {
            var ang = base + (Math.PI * 2 / n) * s;
            addBullet(e.x, e.y, Math.cos(ang) * 180, Math.sin(ang) * 180,
              { r: 6, dmg: 9, color: '#7dd3fc' });
          }
        }
        if (dd < e.r + p.r) hurtPlayer(e.dmg);
      }

      e.x = clamp(e.x, MARGIN + e.r, W - MARGIN - e.r);
      e.y = clamp(e.y, MARGIN + e.r, H - MARGIN - e.r);
    }

    // 分离，避免怪物叠成一坨
    for (var a1 = 0; a1 < G.enemies.length; a1++) {
      for (var b1 = a1 + 1; b1 < G.enemies.length; b1++) {
        var ea = G.enemies[a1], eb = G.enemies[b1];
        var ddx = eb.x - ea.x, ddy = eb.y - ea.y;
        var d3 = Math.sqrt(ddx * ddx + ddy * ddy) || 0.01;
        var minD = ea.r + eb.r;
        if (d3 < minD) {
          var push2 = (minD - d3) / d3 * 0.5;
          ea.x -= ddx * push2; ea.y -= ddy * push2;
          eb.x += ddx * push2; eb.y += ddy * push2;
        }
      }
    }
  }

  // ---------- BOSS ----------

  function spawnBoss() {
    var sp = { x: W / 2, y: MARGIN + 90 };
    G.boss = {
      boss: true, type: 'boss', name: '深渊回响',
      x: sp.x, y: sp.y, r: 36,
      hp: 580, maxHp: 580, speed: 62,
      phase: 1, t: 0, a1: 0, a2: 0, a3: 0,
      flash: 0, rot: 0, dmg: 22
    };
    G.wave = WAVES.length + 1;
    banner('深渊回响', 2.4);
    G.shake = 12;
  }

  function updateBoss(dt) {
    var b = G.boss;
    if (!b) return;
    var p = G.player;
    b.t += dt;
    b.rot += dt * 1.4;
    b.flash = Math.max(0, b.flash - dt);

    var ratio = b.hp / b.maxHp;
    var want = ratio <= 0.3 ? 3 : (ratio <= 0.6 ? 2 : 1);
    if (want > b.phase) {
      b.phase = want;
      G.shake = 14;
      banner('形态 ' + b.phase, 1.6);
      burstParts(b.x, b.y, '#ff2d55', 30, 340);
      // 形态转换时掉一颗补给，避免后段完全无回血手段
      var dropA = Math.random() * Math.PI * 2;
      G.orbs.push({
        x: clamp(b.x + Math.cos(dropA) * 90, MARGIN + 20, W - MARGIN - 20),
        y: clamp(b.y + Math.sin(dropA) * 90, MARGIN + 20, H - MARGIN - 20),
        r: 9, life: 18, t: 0
      });
      var n0 = 18;
      for (var q = 0; q < n0; q++) {
        var aq = (Math.PI * 2 / n0) * q + b.rot;
        addBullet(b.x, b.y, Math.cos(aq) * 205, Math.sin(aq) * 205,
          { r: 7, dmg: 11, color: '#ff5d7a' });
      }
    }

    var dx = p.x - b.x, dy = p.y - b.y;
    var dd = Math.sqrt(dx * dx + dy * dy) || 1;
    var keep = 165;
    var mv = dd > keep ? 1 : (dd < keep - 50 ? -1 : 0);
    b.x += (dx / dd) * b.speed * dt * mv;
    b.y += (dy / dd) * b.speed * dt * mv;
    b.x += Math.cos(b.t * 0.7) * 30 * dt;
    b.y += Math.sin(b.t * 0.9) * 26 * dt;
    b.x = clamp(b.x, MARGIN + b.r, W - MARGIN - b.r);
    b.y = clamp(b.y, MARGIN + b.r, H - MARGIN - b.r);

    if (dd < b.r + p.r) hurtPlayer(b.dmg);

    var aim = Math.atan2(dy, dx);

    b.a1 -= dt;
    if (b.a1 <= 0) {
      if (b.phase === 1) {
        b.a1 = 1.6;
        for (var i1 = -1; i1 <= 1; i1++) {
          addBullet(b.x, b.y, Math.cos(aim + i1 * 0.15) * 250, Math.sin(aim + i1 * 0.15) * 250,
            { r: 7, dmg: 10, color: '#ff5d7a' });
        }
      } else if (b.phase === 2) {
        b.a1 = 1.15;
        for (var i2 = -2; i2 <= 2; i2++) {
          addBullet(b.x, b.y, Math.cos(aim + i2 * 0.11) * 275, Math.sin(aim + i2 * 0.11) * 275,
            { r: 7, dmg: 10, color: '#ff5d7a' });
        }
      } else {
        b.a1 = 0.085;
        var sp2 = b.t * 7.4;
        addBullet(b.x, b.y, Math.cos(sp2) * 225, Math.sin(sp2) * 225,
          { r: 6, dmg: 9, color: '#ff8fa3' });
        addBullet(b.x, b.y, Math.cos(sp2 + Math.PI) * 225, Math.sin(sp2 + Math.PI) * 225,
          { r: 6, dmg: 9, color: '#ff8fa3' });
      }
    }

    b.a2 -= dt;
    if (b.a2 <= 0) {
      if (b.phase === 1) {
        b.a2 = 3.4;
        var n1 = 12;
        for (var j1 = 0; j1 < n1; j1++) {
          var aj1 = (Math.PI * 2 / n1) * j1 + b.rot;
          addBullet(b.x, b.y, Math.cos(aj1) * 195, Math.sin(aj1) * 195,
            { r: 7, dmg: 11, color: '#ff5d7a' });
        }
      } else if (b.phase === 2) {
        b.a2 = 2.6;
        var n2 = 16;
        for (var j2 = 0; j2 < n2; j2++) {
          var aj2 = (Math.PI * 2 / n2) * j2 - b.rot;
          addBullet(b.x, b.y, Math.cos(aj2) * 205, Math.sin(aj2) * 205,
            { r: 7, dmg: 11, color: '#ff5d7a' });
        }
      } else {
        b.a2 = 2.0;
        var n3 = 20;
        for (var j3 = 0; j3 < n3; j3++) {
          var aj3 = (Math.PI * 2 / n3) * j3 + b.rot * 1.6;
          addBullet(b.x, b.y, Math.cos(aj3) * 215, Math.sin(aj3) * 215,
            { r: 7, dmg: 12, color: '#ff5d7a' });
        }
      }
    }

    b.a3 -= dt;
    if (b.a3 <= 0) {
      b.a3 = 7.5;
      if (b.phase >= 2) {
        for (var s2 = 0; s2 < 2; s2++) {
          var pt = spawnPoint(240);
          spawnEnemy(s2 === 0 ? 'grunt' : 'spinner', pt.x, pt.y);
        }
      }
    }

    if (b.hp <= 0) {
      G.phase = 'won';
      G.score += 500;
      burstParts(b.x, b.y, '#ff2d55', 60, 460);
      G.shake = 18;
      showOverlay('回响已止', '你杀死了深渊回响。<br>得分 <b>' + G.score + '</b>，剩余生命 <b>' +
        Math.ceil(G.player.hp) + '</b>。', '再来一次');
    }
  }

  // ---------- 子弹 / 粒子 / 球 ----------

  function updateBullets(dt) {
    var p = G.player;
    for (var i = G.bullets.length - 1; i >= 0; i--) {
      var b = G.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        G.bullets.splice(i, 1);
        continue;
      }
      if (dist2(b.x, b.y, p.x, p.y) < (b.r + p.r) * (b.r + p.r)) {
        if (hurtPlayer(b.dmg)) {
          G.bullets.splice(i, 1);
        }
      }
    }
  }

  function updateParts(dt) {
    for (var i = G.parts.length - 1; i >= 0; i--) {
      var q = G.parts[i];
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.vx *= 0.94; q.vy *= 0.94;
      q.life -= dt;
      if (q.life <= 0) G.parts.splice(i, 1);
    }
  }

  function updateOrbs(dt) {
    var p = G.player;
    for (var i = G.orbs.length - 1; i >= 0; i--) {
      var o = G.orbs[i];
      o.t += dt;
      o.life -= dt;
      var d = Math.sqrt(dist2(o.x, o.y, p.x, p.y));
      if (d < 26) {
        p.hp = Math.min(p.maxHp, p.hp + 14);
        burstParts(o.x, o.y, '#6ee7b7', 10, 220);
        G.orbs.splice(i, 1);
        continue;
      }
      if (o.life <= 0) G.orbs.splice(i, 1);
    }
  }

  function updateWaves(dt) {
    if (G.phase !== 'playing') return;
    if (G.boss) return;
    if (G.enemies.length > 0) { G.clearT = 0; return; }

    G.clearT += dt;
    if (G.clearT < 1.15) return;
    G.clearT = 0;

    if (G.wave >= WAVES.length) {
      spawnBoss();
      return;
    }

    G.wave++;
    var list = WAVES[G.wave - 1];
    for (var i = 0; i < list.length; i++) {
      var pt = spawnPoint(210);
      spawnEnemy(list[i], pt.x, pt.y);
    }
    banner('第 ' + G.wave + ' 波', 1.5);
  }

  function cleanup() {
    for (var i = G.enemies.length - 1; i >= 0; i--) {
      if (G.enemies[i].hp <= 0) G.enemies.splice(i, 1);
    }
  }

  function tick(dt) {
    if (G.phase !== 'playing') {
      updateParts(dt);
      if (G.bannerT > 0) G.bannerT -= dt;
      return;
    }
    G.time += dt;
    updatePlayer(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateBullets(dt);
    updateOrbs(dt);
    updateParts(dt);
    cleanup();
    updateWaves(dt);

    G.shake = Math.max(0, G.shake - dt * 26);
    if (G.bannerT > 0) G.bannerT -= dt;
    if (G.phase !== 'playing') {
      // 结束后不再推进
    }
  }

  function stepSim(dt) {
    if (!G) return;
    var remain = Math.min(Math.max(dt, 0), 0.25);
    var guard = 0;
    while (remain > 1e-6 && guard++ < 240) {
      var s = Math.min(1 / 120, remain);
      tick(s);
      remain -= s;
    }
  }

  // ---------- 渲染 ----------

  function resize() {
    var availW = stage.clientWidth || 960;
    var availH = Math.max(240, window.innerHeight - 190);
    var s = Math.min(availW / W, availH / H);
    if (!isFinite(s) || s <= 0) s = 1;
    s = Math.min(s, 1.4);
    scale = s;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    canvas.style.width = Math.round(W * scale) + 'px';
    canvas.style.height = Math.round(H * scale) + 'px';
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

    if (G) renderFrame();
  }

  function renderFrame() {
    var p = G ? G.player : null;
    ctx.save();
    var sh = G ? G.shake : 0;
    if (sh > 0.2) ctx.translate(rnd(-sh, sh) * 0.5, rnd(-sh, sh) * 0.5);

    ctx.fillStyle = '#04060b';
    ctx.fillRect(-40, -40, W + 80, H + 80);

    // 网格
    ctx.strokeStyle = 'rgba(90,130,180,0.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 0; gx <= W; gx += 60) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (var gy = 0; gy <= H; gy += 60) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();

    // 场地边框
    ctx.strokeStyle = 'rgba(79,209,197,0.28)';
    ctx.lineWidth = 2;
    ctx.strokeRect(MARGIN, MARGIN, W - MARGIN * 2, H - MARGIN * 2);

    if (!G) { ctx.restore(); return; }

    // 治疗球
    for (var i = 0; i < G.orbs.length; i++) {
      var o = G.orbs[i];
      var pulse = 1 + Math.sin(o.t * 7) * 0.12;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#6ee7b7';
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.32;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * 2.1 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 敌人
    for (var e = 0; e < G.enemies.length; e++) drawEnemy(G.enemies[e]);

    if (G.boss) drawBoss(G.boss);

    // 子弹
    for (var b = 0; b < G.bullets.length; b++) {
      var bu = G.bullets[b];
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = bu.color;
      ctx.beginPath();
      ctx.arc(bu.x, bu.y, bu.r * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = bu.color;
      ctx.beginPath();
      ctx.arc(bu.x, bu.y, bu.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath();
      ctx.arc(bu.x, bu.y, bu.r * 0.42, 0, Math.PI * 2);
      ctx.fill();
    }

    // 粒子
    for (var q = 0; q < G.parts.length; q++) {
      var pt2 = G.parts[q];
      ctx.globalAlpha = Math.max(0, pt2.life / pt2.max);
      ctx.fillStyle = pt2.color;
      ctx.beginPath();
      ctx.arc(pt2.x, pt2.y, pt2.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (p) {
      // 挥刀弧
      if (p.swing > 0) {
        var k = p.swing / 0.14;
        ctx.strokeStyle = 'rgba(255,236,170,' + (0.55 + 0.45 * k) + ')';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(p.x, p.y, ATK_RANGE * 0.82, p.swingAng - ATK_ARC / 2, p.swingAng + ATK_ARC / 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.28 * k) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, ATK_RANGE * 0.92, p.swingAng - ATK_ARC / 2, p.swingAng + ATK_ARC / 2);
        ctx.stroke();
      }

      // 玩家
      var invuln = p.inv > 0 || p.dashT > 0;
      ctx.globalAlpha = invuln ? (0.55 + 0.45 * Math.abs(Math.sin(G.time * 22))) : 1;

      ctx.fillStyle = 'rgba(79,209,197,0.18)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 2.0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = p.flash > 0 ? '#ffffff' : '#4fd1c5';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#06222a';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.45, 0, Math.PI * 2);
      ctx.fill();

      // 朝向
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(p.x + Math.cos(p.facing) * p.r * 0.78, p.y + Math.sin(p.facing) * p.r * 0.78, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 横幅
    if (G.bannerT > 0 && G.banner) {
      var al = Math.min(1, G.bannerT / 0.5);
      ctx.globalAlpha = al;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 40px Consolas, monospace';
      ctx.fillStyle = 'rgba(255,90,120,0.92)';
      ctx.fillText(G.banner, W / 2, H * 0.3);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function drawEnemy(e) {
    var telegraph = e.type === 'charger' && e.state === 'telegraph';
    var col = e.flash > 0 ? '#ffffff' : e.color;

    if (telegraph) {
      var k = clamp(e.t / 0.55, 0, 1);
      ctx.globalAlpha = 0.16 + 0.3 * k;
      ctx.strokeStyle = '#ff4d6a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.aim) * 320, e.y + Math.sin(e.aim) * 320);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.globalAlpha = 0.18;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * 1.75, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = col;
    ctx.beginPath();

    if (e.type === 'grunt') {
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    } else if (e.type === 'charger') {
      var a = e.state === 'dash' ? e.aim : Math.atan2(G.player.y - e.y, G.player.x - e.x);
      ctx.moveTo(e.x + Math.cos(a) * (e.r + 5), e.y + Math.sin(a) * (e.r + 5));
      ctx.lineTo(e.x + Math.cos(a + 2.4) * e.r, e.y + Math.sin(a + 2.4) * e.r);
      ctx.lineTo(e.x + Math.cos(a - 2.4) * e.r, e.y + Math.sin(a - 2.4) * e.r);
      ctx.closePath();
    } else if (e.type === 'shooter') {
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    } else {
      for (var i = 0; i < 6; i++) {
        var ang = Math.PI * 2 / 6 * i + e.t * 1.2;
        var px = e.x + Math.cos(ang) * e.r;
        var py = e.y + Math.sin(ang) * e.r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    ctx.fill();

    if (e.type === 'shooter') {
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 0.55, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (e.hp < e.maxHp) {
      var bw = e.r * 2;
      var r = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(e.x - bw / 2, e.y - e.r - 8, bw, 3);
      ctx.fillStyle = r > 0.5 ? '#4ade80' : (r > 0.25 ? '#fbbf24' : '#ef4444');
      ctx.fillRect(e.x - bw / 2, e.y - e.r - 8, bw * r, 3);
    }
  }

  function drawBoss(b) {
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = '#ff2d55';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(255,90,120,.55)';
    ctx.lineWidth = 2;
    for (var ring = 0; ring < 2; ring++) {
      var rr = b.r + 10 + ring * 13;
      var segs = 5 + ring * 3;
      for (var s = 0; s < segs; s++) {
        var a0 = b.rot * (ring ? -1 : 1) + (Math.PI * 2 / segs) * s;
        ctx.beginPath();
        ctx.arc(b.x, b.y, rr, a0, a0 + 0.55);
        ctx.stroke();
      }
    }

    ctx.fillStyle = b.flash > 0 ? '#ffffff' : (b.phase === 3 ? '#ff2d55' : '#e0344f');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#16030a';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.52, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,140,160,.95)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.2, 0, Math.PI * 2);
    ctx.fill();

    var ratio = Math.max(0, b.hp / b.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(b.x - 60, b.y - b.r - 16, 120, 6);
    ctx.fillStyle = b.phase === 3 ? '#ff2d55' : (b.phase === 2 ? '#fb923c' : '#ef4444');
    ctx.fillRect(b.x - 60, b.y - b.r - 16, 120 * ratio, 6);
  }

  // ---------- HUD ----------

  function updateHUD() {
    if (!G || !G.player) return;
    var p = G.player;
    var pct = clamp(p.hp / p.maxHp, 0, 1);
    hpFill.style.width = (pct * 100) + '%';
    hpText.textContent = Math.ceil(p.hp) + '/' + p.maxHp;
    waveEl.textContent = String(G.wave);
    scoreEl.textContent = String(G.score);
    var dc = p.dashCd / DASH_CD;
    dashFill.style.width = ((1 - dc) * 100) + '%';
    dashFill.style.background = p.dashCd <= 0 ? '#a78bfa' : '#4b3f78';
  }

  function showOverlay(title, html, btnText) {
    ovTitle.textContent = title;
    ovText.innerHTML = html;
    btn.textContent = btnText;
    overlay.classList.remove('hide');
  }

  function startGame() {
    G = emptyState();
    G.player = makePlayer();
    G.phase = 'playing';
    G.wave = 0;
    G.clearT = 0;
    overlay.classList.add('hide');
    G.clearT = 99;          // 让第一波立刻生成
    updateWaves(0.001);
    updateHUD();
    banner('第 1 波', 1.5);
  }

  // ---------- 输入 ----------

  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', function (ev) {
    var k = ev.key;
    if (KEYMAP[k]) { input[KEYMAP[k]] = true; ev.preventDefault(); return; }
    if (k === 'j' || k === 'J') { input.attack = true; ev.preventDefault(); return; }
    if (k === ' ' || k === 'Shift') { input.dash = true; ev.preventDefault(); return; }
    if (k === 'r' || k === 'R') { startGame(); ev.preventDefault(); return; }
  }, { passive: false });

  window.addEventListener('keyup', function (ev) {
    var k = ev.key;
    if (KEYMAP[k]) { input[KEYMAP[k]] = false; return; }
    if (k === 'j' || k === 'J') { input.attack = false; return; }
    if (k === ' ' || k === 'Shift') { input.dash = false; return; }
  });

  canvas.addEventListener('mousedown', function (ev) {
    if (ev.button === 0) input.attack = true;
  });
  window.addEventListener('mouseup', function (ev) {
    if (ev.button === 0) input.attack = false;
  });

  btn.addEventListener('click', function () {
    btn.blur();
    startGame();
  });

  // 触屏摇杆
  var stick = document.getElementById('stick');
  var knob = document.getElementById('knob');
  var stickId = null;

  function stickUpdate(ev) {
    var r = stick.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dx = ev.clientX - cx, dy = ev.clientY - cy;
    var max = r.width / 2 - 8;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; d = max; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    stickVec.x = d < 8 ? 0 : dx / max;
    stickVec.y = d < 8 ? 0 : dy / max;
  }

  function capture(el, ev) {
    try {
      if (el.setPointerCapture) el.setPointerCapture(ev.pointerId);
    } catch (err) { /* 合成事件没有活跃指针，忽略 */ }
  }

  stick.addEventListener('pointerdown', function (ev) {
    stickId = ev.pointerId;
    capture(stick, ev);
    stickUpdate(ev);
    ev.preventDefault();
  });
  stick.addEventListener('pointermove', function (ev) {
    if (stickId === ev.pointerId) stickUpdate(ev);
  });
  function stickEnd(ev) {
    if (stickId !== ev.pointerId) return;
    stickId = null;
    knob.style.transform = 'translate(0,0)';
    stickVec.x = 0; stickVec.y = 0;
  }
  stick.addEventListener('pointerup', stickEnd);
  stick.addEventListener('pointercancel', stickEnd);

  function bindHold(el, prop) {
    el.addEventListener('pointerdown', function (ev) {
      input[prop] = true;
      capture(el, ev);
      ev.preventDefault();
    });
    el.addEventListener('pointerup', function () { input[prop] = false; });
    el.addEventListener('pointercancel', function () { input[prop] = false; });
    el.addEventListener('pointerleave', function () { input[prop] = false; });
  }
  bindHold(document.getElementById('btnAtk'), 'attack');
  bindHold(document.getElementById('btnDash'), 'dash');

  // ---------- 主循环 ----------

  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (!paused) stepSim(dt);
    renderFrame();
    updateHUD();
    if (perfEl && Math.random() < 0.05) {
      perfEl.textContent = G ? ('实体 ' + (G.enemies.length + G.bullets.length + G.parts.length)) : '';
    }
  }

  window.addEventListener('resize', resize);

  // ---------- 调试 / 测试接口 ----------

  window.__echo = {
    get state() { return G; },
    start: startGame,
    step: stepSim,
    render: renderFrame,
    setInput: function (o) {
      for (var k in o) if (o.hasOwnProperty(k)) input[k] = o[k];
    },
    setStick: function (x, y) { stickVec.x = x; stickVec.y = y; },
    setPaused: function (v) { paused = !!v; },
    spawnEnemy: spawnEnemy,
    addBullet: addBullet,
    spawnBossNow: function () { if (G && !G.boss) spawnBoss(); },
    isRunning: function () { return !!G && G.phase === 'playing'; },
    constants: { W: W, H: H, ATK_RANGE: ATK_RANGE, DASH_CD: DASH_CD, DASH_INV: DASH_INV }
  };

  resize();
  G = emptyState();
  G.player = makePlayer();
  renderFrame();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
