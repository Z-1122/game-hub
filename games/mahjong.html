<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1f16" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>大众麻将</title>
<style>
  :root {
    color-scheme: dark;
    --felt-1: #14351f;
    --felt-2: #0a1c12;
    --gold: #e8c46a;
    --gold-dim: rgba(232, 196, 106, 0.32);
    --ink: #f2f6f0;
    --muted: rgba(200, 220, 208, 0.62);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, var(--felt-1) 0%, var(--felt-2) 70%, #050c08 100%);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* 竖屏手机提示：完全由 JS 控制 */
  #rotate-tip {
    display: none;
    position: fixed; inset: 0; z-index: 50;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    background: rgba(4, 10, 7, 0.94);
    text-align: center; padding: 24px;
  }
  body.tip-on #rotate-tip { display: flex; }
  #rotate-tip .phone {
    width: 70px; height: 122px; border-radius: 14px;
    border: 3px solid var(--gold);
    box-shadow: 0 0 30px -6px rgba(232, 196, 106, 0.6);
    animation: rot 2.4s ease-in-out infinite;
    position: relative;
  }
  #rotate-tip .phone::after {
    content: ""; position: absolute; left: 50%; bottom: 7px;
    width: 24px; height: 3px; border-radius: 2px;
    background: var(--gold-dim); transform: translateX(-50%);
  }
  #rotate-tip b { font-size: 18px; letter-spacing: .04em; }
  #rotate-tip span { font-size: 13px; color: var(--muted); line-height: 1.8; }
  #rotate-tip .skip {
    margin-top: 4px; font-size: 13px; padding: 9px 20px; cursor: pointer;
    color: var(--gold); background: rgba(232, 196, 106, 0.1);
    border: 1px solid rgba(232, 196, 106, 0.34); border-radius: 999px;
    font-family: inherit;
  }
  @keyframes rot {
    0%, 35% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  @media (prefers-reduced-motion: reduce) { #rotate-tip .phone { animation: none; transform: rotate(-90deg); } }
  /* 手机全屏（地址栏收起时）用动态视口高度，避免地址栏占位把画面往下压 */
  @supports (height: 100dvh) { #stage { height: 100dvh; } }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="rotate-tip">
  <div class="phone"></div>
  <b>请把手机横过来</b>
  <span>麻将桌面比较宽，横屏才看得清<br />也可以竖屏玩，牌会小一些</span>
  <button class="skip" id="tip-skip" type="button">竖屏也能玩，继续</button>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   *  一、牌的数据模型
   *  万/条/筒 各 1-9，每种 4 张 = 108 张
   *  风牌 东南西北 + 箭牌 中发白，各 4 张 = 28 张
   *  合计 136 张（不含花牌）
   * ============================================================ */

  const SUITS = ['wan', 'tiao', 'tong'];   // 万 条 筒
  const HONORS = ['dong', 'nan', 'xi', 'bei', 'zhong', 'fa', 'bai'];
  const SUIT_CN = { wan: '万', tiao: '条', tong: '筒' };
  const NUM_CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const HONOR_CN = { dong: '东', nan: '南', xi: '西', bei: '北', zhong: '中', fa: '发', bai: '白' };

  // 牌用整数编码：万 1-9 → 1..9；条 → 11..19；筒 → 21..29；字 → 31..37
  const T = {
    wan: (n) => n,
    tiao: (n) => 10 + n,
    tong: (n) => 20 + n,
    honor: (i) => 31 + i,
    suitOf: (t) => (t <= 9 ? 'wan' : t <= 19 ? 'tiao' : t <= 29 ? 'tong' : 'honor'),
    numOf: (t) => (t <= 9 ? t : t <= 19 ? t - 10 : t <= 29 ? t - 20 : 0),
    isHonor: (t) => t >= 31,
    label: (t) => {
      if (t <= 9) return NUM_CN[t] + '万';
      if (t <= 19) return NUM_CN[t - 10] + '条';
      if (t <= 29) return NUM_CN[t - 20] + '筒';
      return HONOR_CN[HONORS[t - 31]];
    },
    short: (t) => {
      if (t <= 9) return String(t) + '万';
      if (t <= 19) return String(t - 10) + '条';
      if (t <= 29) return String(t - 20) + '筒';
      return HONOR_CN[HONORS[t - 31]];
    }
  };

  // 牌堆（每种 4 张）
  function makeWall() {
    const w = [];
    for (const s of SUITS) for (let n = 1; n <= 9; n++) {
      const t = s === 'wan' ? n : s === 'tiao' ? 10 + n : 20 + n;
      for (let k = 0; k < 4; k++) w.push(t);
    }
    for (let i = 0; i < 7; i++) for (let k = 0; k < 4; k++) w.push(31 + i);
    return w;
  }

  /* ============================================================
   *  二、胡牌判定（核心算法）
   *
   *  目标牌型：4 组面子 + 1 对将
   *   面子 = 顺子（同花色连续三张）或 刻子（三张相同）
   *  副露（吃/碰/杠）已经凑满的面子数用 meldCount 计入，
   *  所以需要从手牌里再拆出 (4 - meldCount) 组面子 + 1 对将。
   * ============================================================ */

  // 把 counts 数组（下标 1..37 计数）递归拆分成 needSets 组面子 + 1 对将
  function canFormSets(counts, needSets) {
    if (needSets < 0) return false;

    // 找第一张还有剩余的牌
    let i = 1;
    while (i <= 37 && counts[i] === 0) i++;
    if (i > 37) return needSets === 0;   // 牌用完了，面子也刚好凑齐

    // 尝试做刻子
    if (counts[i] >= 3 && needSets > 0) {
      counts[i] -= 3;
      if (canFormSets(counts, needSets - 1)) { counts[i] += 3; return true; }
      counts[i] += 3;
    }

    // 尝试做顺子（只能数牌，且不超过 7，保证 i+2 同花色）
    const suit = T.suitOf(i);
    const num = T.numOf(i);
    if (suit !== 'honor' && num <= 7 && needSets > 0 && counts[i + 1] > 0 && counts[i + 2] > 0) {
      counts[i]--; counts[i + 1]--; counts[i + 2]--;
      if (canFormSets(counts, needSets - 1)) { counts[i]++; counts[i + 1]++; counts[i + 2]++; return true; }
      counts[i]++; counts[i + 1]++; counts[i + 2]++;
    }

    return false;
  }

  // 判断 14 张（或已副露后的等价张数）能否胡牌
  function canWin(hand, meldCount) {
    const need = 4 - meldCount;             // 还需要几组面子
    const counts = new Array(38).fill(0);
    for (const t of hand) counts[t]++;

    const total = hand.length;
    if (total !== need * 3 + 2) return false;  // 张数不对，直接否

    // 枚举将牌
    for (let p = 1; p <= 37; p++) {
      if (counts[p] >= 2) {
        counts[p] -= 2;
        const ok = canFormSets(counts, need);
        counts[p] += 2;
        if (ok) return true;
      }
    }
    return false;
  }

  // 列出所有可胡的牌（用于听牌提示）：返回能让我胡的牌 id 数组
  function winningTiles(hand, meldCount) {
    const res = [];
    for (let t = 1; t <= 37; t++) {
      if (t >= 31 || t % 10 !== 0) { /* 全部合法牌 id */ }
      // 跳过不存在的 id（如 10、20、30）
      if (t === 10 || t === 20 || t === 30) continue;
      const used = hand.filter((x) => x === t).length;
      if (used >= 4) continue;
      const test = hand.concat([t]);
      if (canWin(test, meldCount)) res.push(t);
    }
    return res;
  }

  // 判断打掉某张后是否听牌
  function tenpaiAfterDiscard(hand, meldCount) {
    const out = new Map();   // tile -> 打掉它之后的听牌数组
    const seen = new Set();
    for (const d of hand) {
      if (seen.has(d)) continue;
      seen.add(d);
      const rest = hand.slice();
      rest.splice(rest.indexOf(d), 1);
      const w = winningTiles(rest, meldCount);
      if (w.length) out.set(d, w);
    }
    return out;
  }

  /* ============================================================
   *  三、游戏状态
   * ============================================================ */

  const SEAT_NAMES = ['你', '下家', '对家', '上家'];
  const WINDS = ['东', '南', '西', '北'];

  const G = {
    wall: [],          // 牌墙（索引 0 为下一张要摸的）
    players: [],       // 4 个玩家
    turn: 0,           // 当前该谁行动
    phase: 'title',    // title | playing | over
    dealer: 0,
    lastDiscard: null, // { tile, from }
    pendingClaim: null,// 等待玩家决定吃碰杠胡
    winner: null,
    log: [],           // 提示文字
    roundNo: 1,
    drawnTile: null,   // 刚摸到的牌（用于加亮）
    wallLeft: 0,
    waitingFor: 'discard' // discard | claim | ai
  };

  function mkPlayer(i) {
    return {
      id: i,
      hand: [],
      melds: [],        // { type:'pon'|'kan', tiles:[...], from }
      discards: [],
      isAI: i !== 0,
      drawn: null,
      tenpai: [],
      score: 0
    };
  }

    // 掷骰定庄后重置一局（dice 可指定，用于动画与发牌保持一致）
  function resetGame(dice) {
    G.wall = shuffle(makeWall());
    G.players = [0, 1, 2, 3].map(mkPlayer);

    const d = (dice && dice.length === 2) ? dice.slice() : rollDice();
    G.dice = d;
    G.dealer = (d[0] + d[1] - 1) % 4;   // 两颗骰子的点数和决定谁坐庄
    G.turn = G.dealer;
    G.phase = 'playing';
    G.lastDiscard = null;
    G.pendingClaim = null;
    G.winner = null;
    G.log = [];
    G.drawnTile = null;
    G.roundNo = 1;

    // 发牌：每人 13 张
    for (let r = 0; r < 13; r++) {
      for (let p = 0; p < 4; p++) G.players[p].hand.push(G.wall.shift());
    }
    for (const p of G.players) sortHand(p.hand);
    G.wallLeft = G.wall.length;

    // 庄家多摸一张
    drawFor(G.dealer);

    // 天胡检查（庄家优先）
    if (canWin(G.players[G.dealer].hand, G.players[G.dealer].melds.length)) {
      if (G.dealer === 0) {
        G.waitingFor = 'discard';
        pushLog('开局就成型，可以自摸！');
      } else {
        declareWin(G.dealer, G.players[G.dealer].hand[G.players[G.dealer].hand.length - 1], 0, true);
        return;
      }
    } else {
      for (let p = 1; p <= 3; p++) {
        if (p === G.dealer) continue;
        if (canWin(G.players[p].hand, G.players[p].melds.length)) {
          declareWin(p, G.players[p].hand[G.players[p].hand.length - 1], 0, true);
          return;
        }
      }
      G.waitingFor = 'discard';
    }

    // 不是自己坐庄，就等电脑先出牌
    if (G.turn !== 0) G.waitingFor = 'ai';
    pushLog('掷骰 ' + d[0] + ' + ' + d[1] + ' = ' + (d[0] + d[1]) + ' 点，' + SEAT_NAMES[G.dealer] + '坐庄。');
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sortHand(h) {
    h.sort((a, b) => a - b);
  }

  function pushLog(s) {
    G.log.push(s);
    if (G.log.length > 6) G.log.shift();
  }

  function drawFor(p) {
    if (G.wall.length === 0) { endRound(null, '流局'); return; }
    const t = G.wall.shift();
    const pl = G.players[p];
    pl.hand.push(t);
    pl.drawn = t;
    G.drawnTile = t;
    G.wallLeft = G.wall.length;
    sfxDrawTile();
    return t;
  }

  /* ============================================================
   *  四、动作：打牌 / 碰 / 杠 / 胡（本玩法不含「吃」）
   * ============================================================ */

  function discard(p, tile) {
    const pl = G.players[p];
    const idx = pl.hand.indexOf(tile);
    if (idx < 0) return false;
    pl.hand.splice(idx, 1);
    sortHand(pl.hand);
    pl.discards.push(tile);
    G.lastDiscard = { tile: tile, from: p };
    G.drawnTile = null;
    pl.drawn = null;
    // 出牌音效统一交给 watchEvents()（联机模式下这里根本不会跑）
    // 玩家出牌后，检查其他三家是否有碰杠胡的机会
    G.turn = (p + 1) % 4;
    offerClaims(p, tile);
    return true;
  }

  // 计算某家对别人打出的牌有哪些可选动作
  function claimOptions(p, tile) {
    if (p === G.turn - 1 + 4 && false) return [];
    const pl = G.players[p];
    const opts = [];
    const same = pl.hand.filter((x) => x === tile).length;

    if (same >= 2) opts.push('pon');
    if (same >= 3) opts.push('kan');
    // 本玩法不含「吃」（用户要求去掉），只能碰 / 杠 / 胡
    // 胡：把这张牌加入手牌后能否成胡
    const test = pl.hand.concat([tile]);
    if (canWin(test, pl.melds.length)) opts.push('hu');
    return opts;
  }

  // 玩家出牌后，询问其他三家。人类优先决定；AI 直接响应。
  function offerClaims(from, tile) {
    G.pendingClaim = null;
    G.waitingFor = 'ai';
    // 人类（0 号）能做什么
    if (from !== 0) {
      const opts = claimOptions(0, tile);
      if (opts.length) {
        G.pendingClaim = { tile: tile, from: from, options: opts };
        G.waitingFor = 'claim';
        return;
      }
    }
    // AI 依次响应
    aiRespond(from, tile);
  }

  function applyPon(p, tile, from) {
    const pl = G.players[p];
    for (let k = 0; k < 2; k++) pl.hand.splice(pl.hand.indexOf(tile), 1);
    pl.melds.push({ type: 'pon', tiles: [tile, tile, tile], from: from });
    // 打出的那张牌从牌河移除
    const src = G.players[from];
    src.discards.pop();
    G.lastDiscard = null;
    G.turn = p;
    pl.drawn = null;
    G.drawnTile = null;
    pushLog(SEAT_NAMES[p] + ' 碰了 ' + T.short(tile));
  }

  function applyKan(p, tile, from, isConcealed) {
    const pl = G.players[p];
    if (isConcealed) {
      for (let k = 0; k < 4; k++) pl.hand.splice(pl.hand.indexOf(tile), 1);
      pl.melds.push({ type: 'kan', tiles: [tile, tile, tile, tile], from: p, concealed: true });
      pushLog(SEAT_NAMES[p] + ' 暗杠 ' + T.short(tile));
    } else {
      for (let k = 0; k < 3; k++) pl.hand.splice(pl.hand.indexOf(tile), 1);
      pl.melds.push({ type: 'kan', tiles: [tile, tile, tile, tile], from: from });
      G.players[from].discards.pop();
      G.lastDiscard = null;
      pushLog(SEAT_NAMES[p] + ' 杠了 ' + T.short(tile));
    }
    G.turn = p;
    // 杠后补一张
    const t = drawFor(p);
    G.waitingFor = p === 0 ? 'discard' : 'ai';
    if (p !== 0) setTimeout(() => { aiTurn(p); markDirty(); }, 420);
    return t;
  }

  function declareWin(p, tile, from, selfDraw) {
    G.phase = 'over';
    G.winner = { p: p, tile: tile, from: from, selfDraw: !!selfDraw };
    G.waitingFor = 'none';
    const pl = G.players[p];
    if (!selfDraw && tile != null) pl.hand.push(tile);
    sortHand(pl.hand);
    pushLog(SEAT_NAMES[p] + (selfDraw ? ' 自摸！' : ' 胡了 ' + T.short(tile) + '！'));
  }

  function endRound(winner, reason) {
    G.phase = 'over';
    G.winner = winner;
    G.waitingFor = 'none';
    pushLog(reason);
  }

  /* ============================================================
   *  五、AI 出牌策略
   *  简单但不算傻：优先打孤张字牌，其次算每张牌的有效进张数
   * ============================================================ */

  // 计算某张牌对当前手牌的「有用程度」，越低越该打
  function tileValue(hand, tile) {
    const counts = new Array(38).fill(0);
    for (const t of hand) counts[t]++;
    const c = counts[tile];
    let v = 0;
    if (c >= 3) v += 100;          // 已经是刻子
    if (c === 2) v += 40;          // 对子
    if (T.isHonor(tile)) {
      v += c > 1 ? 20 : 0;         // 字牌只有成对才有用
      return v;
    }
    const n = T.numOf(tile), base = tile - n;
    // 邻牌：能组成顺子的可能性
    for (let d = -2; d <= 2; d++) {
      if (d === 0) continue;
      const nn = n + d;
      if (nn >= 1 && nn <= 9 && counts[base + nn] > 0) {
        v += Math.abs(d) === 1 ? 12 : 6;
      }
    }
    // 中张更容易连牌
    v += (n >= 3 && n <= 7) ? 6 : 0;
    return v;
  }

  function aiChooseDiscard(p) {
    const pl = G.players[p];
    const uniq = Array.from(new Set(pl.hand));
    // 先看有没有打一张就听牌的
    const tp = tenpaiAfterDiscard(pl.hand, pl.melds.length);
    if (tp.size) {
      let best = null, bestN = -1;
      for (const [d, w] of tp) {
        if (w.length > bestN) { bestN = w.length; best = d; }
      }
      if (best != null) return best;
    }
    // 否则打掉最没用的
    let worst = uniq[0], worstV = Infinity;
    for (const t of uniq) {
      const v = tileValue(pl.hand, t);
      if (v < worstV) { worstV = v; worst = t; }
    }
    return worst;
  }

  function aiRespond(from, tile) {
    // 三家按顺序看是否要碰/杠/胡（简化：都不吃）
    const order = [];
    for (let k = 1; k <= 3; k++) order.push((from + k) % 4);

    for (const p of order) {
      if (p === 0) continue;                 // 人类已单独处理
      const opts = claimOptions(p, tile);
      if (opts.includes('hu')) {
        declareWin(p, tile, from, false);
        return;
      }
    }
    for (const p of order) {
      if (p === 0) continue;
      const pl = G.players[p];
      const same = pl.hand.filter((x) => x === tile).length;
      if (same >= 3) { applyKan(p, tile, from, false); return; }
    }
    for (const p of order) {
      if (p === 0) continue;
      const pl = G.players[p];
      const same = pl.hand.filter((x) => x === tile).length;
      if (same >= 2) { applyPon(p, tile, from); afterMeld(p); return; }
    }
    // 没人要，下一家摸牌
    nextDraw();
  }

  function afterMeld(p) {
    if (p === 0) { G.waitingFor = 'discard'; return; }
    G.waitingFor = 'ai';
    setTimeout(() => { aiTurn(p); markDirty(); }, 420);
  }

  function nextDraw() {
    if (G.phase !== 'playing') return;
    const p = G.turn;
    const t = drawFor(p);
    if (G.phase !== 'playing') return;
    // 自摸判断
    if (canWin(G.players[p].hand, G.players[p].melds.length)) {
      if (p === 0) {
        G.waitingFor = 'discard';      // 玩家自己决定要不要胡
        pushLog('你摸到了可以胡的牌！');
      } else {
        declareWin(p, t, p, true);
        return;
      }
    }
    // 暗杠检查（AI）
    if (p !== 0) {
      G.waitingFor = 'ai';
      setTimeout(() => { aiTurn(p); markDirty(); }, 460);
    } else {
      G.waitingFor = 'discard';
    }
  }

  function aiTurn(p) {
    if (G.phase !== 'playing' || G.turn !== p) return;
    const pl = G.players[p];
    // 暗杠
    const counts = new Array(38).fill(0);
    for (const t of pl.hand) counts[t]++;
    for (let t = 1; t <= 37; t++) {
      if (counts[t] === 4) { applyKan(p, t, p, true); return; }
    }
    const d = aiChooseDiscard(p);
    discard(p, d);
  }

  /* ============================================================
   *  五点五、音效（WebAudio 实时合成，零外部资源）
   *  首次交互时创建 / 恢复 AudioContext（浏览器自动播放策略要求）
   * ============================================================ */

  let AC = null;
  let muted = (function () {
    try { return localStorage.getItem('mj_muted') === '1'; } catch (e) { return false; }
  })();

  function audioCtx() {
    if (muted) return null;
    try {
      if (!AC) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        AC = new C();
      }
      if (AC.state === 'suspended' && AC.resume) AC.resume();
      return AC;
    } catch (e) { return null; }
  }

  function nowT() { const a = audioCtx(); return a ? a.currentTime : null; }

  /* —— 音频总线：一路干声 + 一路短混响，整体过温和压限，避免刺耳 ——
   * 件件都用 try/catch 包住：老浏览器缺哪个节点就自动降级，不报错。 */
  let MASTER = null, DRY = null, WET_IN = null, WARM = null;

  function buildBus(a) {
    if (MASTER) return;
    try {
      MASTER = a.createGain(); MASTER.gain.value = 0.68;
      if (a.createDynamicsCompressor) {
        const comp = a.createDynamicsCompressor();
        try {
          comp.threshold.value = -20; comp.knee.value = 26; comp.ratio.value = 2.8;
          comp.attack.value = 0.006; comp.release.value = 0.30;
        } catch (e) { /* 某些实现只读 */ }
        let tail = MASTER;
        if (a.createBiquadFilter) {
          WARM = a.createBiquadFilter();
          WARM.type = 'lowpass'; WARM.frequency.value = 4600; WARM.Q.value = 0.4;
          MASTER.connect(WARM); tail = WARM;
        }
        tail.connect(comp); comp.connect(a.destination);
      } else {
        MASTER.connect(a.destination);
      }
      DRY = a.createGain(); DRY.gain.value = 0.88; DRY.connect(WARM || MASTER);
      // 短混响：现场生成一段指数衰减的噪声脉冲响应
      if (a.createConvolver && a.createBuffer) {
        const len = Math.max(1, Math.floor(a.sampleRate * 0.32));
        const ir = a.createBuffer(2, len, a.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) {
            const x = i / len;
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 3.1);
          }
        }
        const conv = a.createConvolver(); conv.buffer = ir;
        WET_IN = a.createGain(); WET_IN.gain.value = 0.26;
        const wet = a.createGain(); wet.gain.value = 0.55;
        WET_IN.connect(conv); conv.connect(wet); wet.connect(WARM || MASTER);
      }
    } catch (e) { MASTER = null; DRY = null; WET_IN = null; }
  }

  // 把某个输出节点接到总线上（wet 为送混响的量，0~1）
  function out(node, wet) {
    const a = audioCtx(); if (!a) return;
    buildBus(a);
    try {
      if (DRY) node.connect(DRY); else node.connect(a.destination);
      if (WET_IN && wet) node.connect(WET_IN);
    } catch (e) { try { node.connect(a.destination); } catch (e2) { /* 忽略 */ } }
  }

  // 一个音符：两只轻微失谐的振荡器（更厚）+ 会收拢的低通 + 平滑包络
  function tone(t0, dur, f0, f1, type, vol, wet) {
    const a = audioCtx(); if (!a) return;
    try {
      const atk = Math.min(0.02, Math.max(0.002, dur * 0.25));
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(Math.max(0.0004, vol || 0.1), t0 + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      const lp = a.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 0.6;
      const hi = Math.min(11000, Math.max(700, (f1 || f0) * 5.5));
      const lo = Math.max(300, (f1 || f0) * 1.7);
      lp.frequency.setValueAtTime(hi, t0);
      lp.frequency.exponentialRampToValueAtTime(lo, t0 + dur);
      lp.connect(g);
      for (let k = 0; k < 2; k++) {
        const o = a.createOscillator();
        o.type = type || 'sine';
        try { o.detune.value = k === 0 ? -5 : 5; } catch (e) { /* 忽略 */ }
        o.frequency.setValueAtTime(f0, t0);
        if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
        o.connect(lp);
        o.start(t0); o.stop(t0 + dur + 0.05);
      }
      out(g, wet);
    } catch (e) { /* 忽略音频异常 */ }
  }

  // 噪声脉冲：牌磕在桌面上的空气声（指数衰减，比线性更自然）
  function noiseHit(t0, dur, vol, hz, q, wet) {
    const a = audioCtx(); if (!a) return;
    try {
      const n = Math.max(1, Math.floor(a.sampleRate * dur));
      const buf = a.createBuffer(1, n, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        const x = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.exp(-x * 8.5) * (1 - x);
      }
      const src = a.createBufferSource(); src.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = hz || 1500; f.Q.value = q || 0.7;
      const g = a.createGain(); g.gain.value = vol || 0.1;
      src.connect(f);
      if (a.createBiquadFilter) {
        // 再压一道低通，削掉噪声里刺耳的「嘶」
        const soft = a.createBiquadFilter();
        soft.type = 'lowpass';
        soft.frequency.value = Math.max(900, (hz || 1500) * 1.7);
        soft.Q.value = 0.5;
        f.connect(soft); soft.connect(g);
      } else {
        f.connect(g);
      }
      out(g, wet);
      src.start(t0);
    } catch (e) { /* 忽略音频异常 */ }
  }

  // 一次「牌磕桌」：空气声 + 木头的低频共鸣，听起来才像真牌
  function clack(t0, vol, hz, dur, wet) {
    noiseHit(t0, dur * 1.15, vol * 0.78, hz * 0.66, 1.05, wet);
    tone(t0, dur * 2.4, hz * 0.17, hz * 0.10, 'sine', vol * 0.42, wet);
    tone(t0 + 0.004, dur * 1.5, hz * 0.40, hz * 0.32, 'sine', vol * 0.15, wet);
  }

  function sfxDiscard() {              // 普通出牌：一声清脆「啪嗒」，干净利落
    const t = nowT(); if (t === null) return;
    clack(t, 0.23, 2200, 0.055, 0.16);
    tone(t + 0.012, 0.08, 760, 640, 'sine', 0.035, 0.1);
  }
  function sfxDrawTile() {             // 摸牌：轻轻一声「嗒」
    const t = nowT(); if (t === null) return;
    clack(t, 0.10, 2400, 0.04, 0.1);
  }
  function sfxRivalDiscard() {         // 别人出牌：比自己的轻、比摸牌实，听得出方位
    const t = nowT(); if (t === null) return;
    clack(t, 0.14, 1800, 0.05, 0.22);
  }
  function sfxPon() {                  // 碰：三张牌连续拍下 + 明亮上行三音
    const t = nowT(); if (t === null) return;
    clack(t,         0.23, 1750, 0.065, 0.30);
    clack(t + 0.085, 0.25, 1900, 0.065, 0.30);
    clack(t + 0.170, 0.27, 2050, 0.075, 0.34);
    tone(t + 0.19, 0.45, 523, 523, 'sine', 0.075, 0.5);   // G5
    tone(t + 0.19, 0.45, 784, 784, 'sine', 0.055, 0.5);     // D6
    tone(t + 0.30, 0.52, 1046, 1046, 'sine', 0.045, 0.55);    // G6
  }
  function sfxKan() {                  // 杠：四张牌更重地砸下 + 低音锣，明显比碰低沉悠长
    const t = nowT(); if (t === null) return;
    for (let i = 0; i < 4; i++) clack(t + i * 0.072, 0.25, 1350 - i * 90, 0.085, 0.30);
    tone(t + 0.30, 1.10, 146, 138, 'sine', 0.17, 0.7);       // 低音锣
    tone(t + 0.30, 0.90, 219, 207, 'sine', 0.075, 0.65);
    tone(t + 0.34, 1.40, 73, 70, 'sine', 0.16, 0.5);         // 更深的一层
  }
  function sfxHu() {                   // 自己胡：上行琶音，铃铛感
    const t = nowT(); if (t === null) return;
    const seq = [523, 659, 784, 1047, 1319];
    for (let i = 0; i < seq.length; i++) {
      const last = (i === seq.length - 1);
      tone(t + i * 0.08, last ? 0.85 : 0.22, seq[i], seq[i], 'sine', last ? 0.10 : 0.07, 0.5);
      tone(t + i * 0.08, last ? 0.70 : 0.16, seq[i] * 2, seq[i] * 2, 'sine', last ? 0.035 : 0.02, 0.45);
    }
    clack(t, 0.16, 2200, 0.05, 0.2);
  }
  function sfxOtherWin() {             // 别人胡：下行两声，柔和
    const t = nowT(); if (t === null) return;
    tone(t, 0.32, 440, 440, 'triangle', 0.09, 0.35);
    tone(t + 0.19, 0.50, 330, 294, 'triangle', 0.09, 0.40);
    tone(t + 0.19, 0.50, 165, 147, 'sine', 0.05, 0.30);
  }
  function sfxFlow() {                 // 流局：低沉一下
    const t = nowT(); if (t === null) return;
    tone(t, 0.70, 240, 150, 'sine', 0.10, 0.40);
    tone(t + 0.05, 0.65, 120, 96, 'sine', 0.07, 0.30);
  }
  function sfxTap() {                  // 按钮：轻点
    const t = nowT(); if (t === null) return;
    tone(t, 0.06, 720, 600, 'sine', 0.04, 0.12);
    noiseHit(t, 0.022, 0.03, 2200, 1.0, 0.08);
  }

  // 名字表（测试与调试用；顺序即 sfxAll 的播放顺序）
  const SFX = {
    tap: sfxTap, discard: sfxDiscard, draw: sfxDrawTile, pon: sfxPon,
    kan: sfxKan, hu: sfxHu, otherWin: sfxOtherWin, flow: sfxFlow
  };

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('mj_muted', muted ? '1' : '0'); } catch (e) { /* 忽略 */ }
    if (!muted) sfxTap();
    markDirty();
  }

  /* ============================================================
   *  六、渲染
   * ============================================================ */

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { alpha: false });

  let VW = 1280, VH = 720;     // 逻辑分辨率
  let dpr = 1;
  let scale = 1, offX = 0, offY = 0;

  function fit() {
    const raw = window.devicePixelRatio || 1;
    const ndpr = Math.min(3, Math.max(1, raw));
    const w = canvasCssWidth(), h = canvasCssHeight();
    const bw = Math.round(w * ndpr), bh = Math.round(h * ndpr);
    const nscale = Math.min(w / VW, h / VH);
    const noffX = (w - VW * nscale) / 2;
    const noffY = (h - VH * nscale) / 2;
    // 关键：只有几何真的变了才动 canvas。
    // 重设 cv.width 会清空整张位图并让浏览器重排，是「闪」的直接来源；
    // 而 tickOrientation 每 700ms 就会调一次 fit，此前等于每 0.7 秒白闪一次。
    if (ndpr === dpr && bw === cv.width && bh === cv.height &&
        nscale === scale && noffX === offX && noffY === offY) {
      return false;
    }
    dpr = ndpr;
    cv.width = bw;
    cv.height = bh;
    scale = nscale;
    offX = noffX;
    offY = noffY;
    markDirty();
    return true;
  }

  function canvasCssWidth() { return cv.clientWidth || window.innerWidth || VW; }
  function canvasCssHeight() { return cv.clientHeight || window.innerHeight || VH; }

  function applyTransform() {
    // setTransform 在部分手机浏览器上每次调用都会让 canvas 失效重绘，
    // 几何没变就别调（和 fit() 幂等化同一套思路，防闪）。
    const tx = dpr * scale, ty = dpr * offX, tz = dpr * offY;
    if (tx === lastTx && ty === lastTfx && tz === lastTfy && lastTransformSet) return;
    lastTransformSet = true;
    lastTx = tx; lastTfx = ty; lastTfy = tz;
    ctx.setTransform(tx, 0, 0, tx, ty, tz);
  }
  var lastTransformSet = false, lastTx = 0, lastTfx = 0, lastTfy = 0;

  // 牌面尺寸
  // 构建标记：用于确认浏览器实际加载的是哪一版（部署漏传 / 缓存排查用）
  const BUILD = '2026-10-29 #7';

  const TW = 56, TH = 76;         // 竖着的牌（手牌/牌河）—— 2026-10-26 放大，手牌更好认
  const TD = 0.30;                // 牌的「厚度」比率（用于侧向牌）

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    const rr = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  /* ---- 牌面样式：仿真实麻将牌（万/筒/条/字牌） ---- */
  const TILE_GLYPH = { dong: '東', nan: '南', xi: '西', bei: '北', zhong: '中', fa: '發', bai: '白' };
  const INK = '#202c25';
  const INK_RED = '#b8352e';
  const INK_GREEN = '#1c7a45';
  const INK_BLUE = '#2a5580';

  // 筒子点位（相对内区的 0~1 坐标）
  const PIP_POS = {
    1: [[0.5, 0.5]],
    2: [[0.5, 0.28], [0.5, 0.72]],
    3: [[0.27, 0.24], [0.5, 0.5], [0.73, 0.76]],
    4: [[0.3, 0.28], [0.7, 0.28], [0.3, 0.72], [0.7, 0.72]],
    5: [[0.28, 0.24], [0.72, 0.24], [0.5, 0.5], [0.28, 0.76], [0.72, 0.76]],
    6: [[0.3, 0.2], [0.7, 0.2], [0.3, 0.5], [0.7, 0.5], [0.3, 0.8], [0.7, 0.8]],
    7: [[0.24, 0.18], [0.5, 0.26], [0.76, 0.34], [0.34, 0.64], [0.66, 0.64], [0.34, 0.87], [0.66, 0.87]],
    8: [[0.3, 0.14], [0.7, 0.14], [0.3, 0.38], [0.7, 0.38], [0.3, 0.62], [0.7, 0.62], [0.3, 0.86], [0.7, 0.86]],
    9: [[0.25, 0.18], [0.5, 0.18], [0.75, 0.18], [0.25, 0.5], [0.5, 0.5], [0.75, 0.5], [0.25, 0.82], [0.5, 0.82], [0.75, 0.82]]
  };
  // 条子点位
  const STICK_POS = {
    2: [[0.5, 0.27], [0.5, 0.73]],
    3: [[0.5, 0.22], [0.32, 0.66], [0.68, 0.66]],
    4: [[0.32, 0.28], [0.68, 0.28], [0.32, 0.72], [0.68, 0.72]],
    5: [[0.3, 0.25], [0.7, 0.25], [0.5, 0.5], [0.3, 0.75], [0.7, 0.75]],
    6: [[0.28, 0.26], [0.5, 0.26], [0.72, 0.26], [0.28, 0.74], [0.5, 0.74], [0.72, 0.74]],
    7: [[0.5, 0.15], [0.28, 0.56], [0.5, 0.56], [0.72, 0.56], [0.28, 0.88], [0.5, 0.88], [0.72, 0.88]],
    8: [[0.3, 0.2], [0.5, 0.3], [0.7, 0.2], [0.3, 0.5], [0.7, 0.5], [0.3, 0.8], [0.5, 0.7], [0.7, 0.8]],
    9: [[0.26, 0.2], [0.5, 0.2], [0.74, 0.2], [0.26, 0.5], [0.5, 0.5], [0.74, 0.5], [0.26, 0.8], [0.5, 0.8], [0.74, 0.8]]
  };

  // 点位之间的最小间距，用来决定圆点/竹节的尺寸
  function minSpacing(pos, iw, ih) {
    let g = Math.min(iw, ih);
    for (let i = 0; i < pos.length; i++) {
      for (let j = i + 1; j < pos.length; j++) {
        const dx = (pos[i][0] - pos[j][0]) * iw;
        const dy = (pos[i][1] - pos[j][1]) * ih;
        g = Math.min(g, Math.sqrt(dx * dx + dy * dy));
      }
    }
    return g;
  }

  function dotColor(n, i) {
    if (n === 1) return INK_RED;
    if (n === 3 && i === 1) return INK_RED;
    if (n === 5 && i === 2) return INK_RED;
    if (n === 7 && i === 1) return INK_RED;
    if (n === 9 && i === 4) return INK_RED;
    if (n === 2 || n === 6) return INK_GREEN;
    return (i % 2 === 0) ? INK_GREEN : INK_BLUE;
  }

  // 一个筒子：外圈 + 实心点
  function drawDot(cx, cy, r, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, r * 0.34);
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.40, 0, Math.PI * 2);
    ctx.fill();
  }

  // 一根竹（条子）
  function drawStick(cx, cy, w, h, color) {
    const x = cx - w / 2, y = cy - h / 2;
    ctx.fillStyle = color;
    roundRect(x, y, w, h, Math.min(w / 2, 2.4));
    ctx.fill();
    if (h > 9) {
      ctx.strokeStyle = 'rgba(253,251,243,0.8)';
      ctx.lineWidth = Math.max(0.8, h * 0.07);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.12, cy - h * 0.15); ctx.lineTo(x + w * 0.88, cy - h * 0.15);
      ctx.moveTo(x + w * 0.12, cy + h * 0.15); ctx.lineTo(x + w * 0.88, cy + h * 0.15);
      ctx.stroke();
    }
  }

  // 一条：一只小雀
  function drawBird(cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);

    // 尾羽：左侧三根散开的羽枝
    ctx.strokeStyle = INK_GREEN;
    ctx.lineWidth = Math.max(1, s * 0.11);
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-s * 0.16, s * 0.26);
      ctx.quadraticCurveTo(-s * (0.52 + i * 0.08), s * (0.42 + i * 0.14), -s * (0.68 + i * 0.10), s * (0.80 + i * 0.12));
      ctx.stroke();
    }

    // 身体
    ctx.fillStyle = INK_GREEN;
    ctx.beginPath();
    ctx.ellipse(s * 0.05, s * 0.16, s * 0.36, s * 0.50, -0.18, 0, Math.PI * 2);
    ctx.fill();

    // 头
    ctx.beginPath();
    ctx.arc(s * 0.07, -s * 0.44, s * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛
    ctx.fillStyle = '#fbf8ef';
    ctx.beginPath(); ctx.arc(s * 0.13, -s * 0.49, s * 0.065, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(s * 0.14, -s * 0.49, s * 0.032, 0, Math.PI * 2); ctx.fill();

    // 嘴
    ctx.fillStyle = INK_RED;
    ctx.beginPath();
    ctx.moveTo(s * 0.27, -s * 0.52);
    ctx.lineTo(s * 0.52, -s * 0.42);
    ctx.lineTo(s * 0.27, -s * 0.32);
    ctx.closePath(); ctx.fill();

    // 翅膀
    ctx.strokeStyle = 'rgba(251,248,239,0.72)';
    ctx.lineWidth = Math.max(0.8, s * 0.07);
    ctx.beginPath();
    ctx.arc(s * 0.08, s * 0.18, s * 0.24, Math.PI * 0.18, Math.PI * 0.92);
    ctx.stroke();

    // 脚
    ctx.strokeStyle = INK_RED;
    ctx.lineWidth = Math.max(0.8, s * 0.065);
    ctx.beginPath();
    ctx.moveTo(s * 0.02, s * 0.62); ctx.lineTo(s * 0.02, s * 0.82);
    ctx.moveTo(-s * 0.10, s * 0.82); ctx.lineTo(s * 0.14, s * 0.82);
    ctx.stroke();

    ctx.restore();
  }

  // 画一张立牌。vertical=true 表示牌面朝上竖放
  // 一张牌（立体：顶面 + 侧面厚度 + 投影 + 浮雕图案）
  // 注意：整体仍然只占 w×h 的格子，侧面画在格子内部，避免放大后把版式挤歪
  function drawTile(t, x, y, w, h, opts) {
    opts = opts || {};
    const face = opts.face !== false;
    const hi = opts.highlight;
    const lift = opts.lift || 0;          // 摸到手的那张会抬起来
    const yy = y - lift;
    const m = Math.min(w, h);
    const r = Math.max(2.5, m * 0.10);
    const side = Math.max(2, Math.min(h * 0.09, m * 0.14));
    const fh = h - side;                  // 顶面高度

    // ---- 投影：抬得越高影子越远越淡 ----
    ctx.fillStyle = lift > 0 ? 'rgba(3,14,9,0.32)' : 'rgba(3,14,9,0.22)';
    roundRect(x + 1.4 + lift * 0.30, yy + side * 0.9 + 1.2 + lift * 0.55, w, h - side * 0.6, r);
    ctx.fill();

    // ---- 侧面（象牙色的切面，立体的关键）----
    const gs = ctx.createLinearGradient(x, yy + side, x, yy + h);
    if (face) { gs.addColorStop(0, '#dbd1b6'); gs.addColorStop(1, '#a89e85'); }
    else { gs.addColorStop(0, '#1b4a2c'); gs.addColorStop(1, '#0b2416'); }
    ctx.fillStyle = gs;
    roundRect(x, yy + side * 0.55, w, h - side * 0.55, r);
    ctx.fill();

    // ---- 顶面 ----
    const g = ctx.createLinearGradient(x, yy, x + w * 0.72, yy + fh);
    if (face) {
      g.addColorStop(0, '#fffdf6');
      g.addColorStop(0.52, '#f8f3e3');
      g.addColorStop(1, '#e4ddc8');
    } else {
      g.addColorStop(0, '#357a50');
      g.addColorStop(0.58, '#28603d');
      g.addColorStop(1, '#1a4629');
    }
    ctx.fillStyle = g;
    roundRect(x, yy, w, fh, r);
    ctx.fill();

    // ---- 顶面高光 / 底缘暗角 ----
    ctx.save();
    roundRect(x, yy, w, fh, r);
    ctx.clip();
    const gl = ctx.createLinearGradient(x, yy, x, yy + fh * 0.42);
    gl.addColorStop(0, face ? 'rgba(255,255,255,0.90)' : 'rgba(170,255,200,0.14)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(x, yy, w, fh * 0.42);
    const gd = ctx.createLinearGradient(x, yy + fh * 0.76, x, yy + fh);
    gd.addColorStop(0, 'rgba(120,100,70,0)');
    gd.addColorStop(1, face ? 'rgba(120,100,70,0.20)' : 'rgba(0,0,0,0.32)');
    ctx.fillStyle = gd;
    ctx.fillRect(x, yy + fh * 0.76, w, fh * 0.24);
    ctx.restore();

    // ---- 边框 ----
    ctx.strokeStyle = hi ? '#ffd76a' : (face ? 'rgba(120,104,74,0.40)' : 'rgba(232,196,106,0.28)');
    ctx.lineWidth = hi ? Math.max(1.8, m * 0.048) : Math.max(0.8, m * 0.016);
    roundRect(x, yy, w, fh, r);
    ctx.stroke();

    if (!face) {
      // 牌背花纹
      ctx.strokeStyle = 'rgba(232,196,106,0.16)';
      ctx.lineWidth = Math.max(0.8, m * 0.02);
      roundRect(x + w * 0.16, yy + fh * 0.14, w * 0.68, fh * 0.72, r * 0.8);
      ctx.stroke();
      return;
    }

    const suit = T.suitOf(t);
    const num = T.numOf(t);

    const padX = w * 0.13, padY = fh * 0.10;
    const ix = x + padX, iy = yy + padY, iw = w - padX * 2, ih = fh - padY * 2;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 浮雕效果：给图案加一层向右下的白色投影，看起来像刻进象牙里
    if (m >= 18) {
      ctx.shadowColor = 'rgba(255,255,255,0.78)';
      ctx.shadowOffsetX = Math.max(0.6, m * 0.013);
      ctx.shadowOffsetY = Math.max(0.9, m * 0.02);
      ctx.shadowBlur = 0;
    }

    if (suit === 'honor') {
      const glyph = TILE_GLYPH[HONORS[t - 31]] || '?';
      if (glyph === '白') {
        // 白板：空心双框
        ctx.strokeStyle = INK_BLUE;
        ctx.lineWidth = Math.max(1.2, w * 0.05);
        roundRect(x + w * 0.20, yy + fh * 0.15, w * 0.60, fh * 0.70, w * 0.07);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(42,85,128,0.42)';
        ctx.lineWidth = Math.max(0.8, w * 0.022);
        roundRect(x + w * 0.27, yy + fh * 0.23, w * 0.46, fh * 0.54, w * 0.05);
        ctx.stroke();
      } else {
        ctx.fillStyle = glyph === '中' ? INK_RED : (glyph === '發' ? INK_GREEN : INK);
        ctx.font = '700 ' + Math.round(w * 0.76) + 'px "PingFang SC","Microsoft YaHei","SimSun",serif';
        ctx.fillText(glyph, x + w / 2, yy + fh / 2 + fh * 0.015);
      }
    } else if (suit === 'wan') {
      // 汉字数字 + 红「萬」
      ctx.fillStyle = INK;
      ctx.font = '700 ' + Math.round(w * 0.46) + 'px "PingFang SC","Microsoft YaHei","SimSun",serif';
      ctx.fillText(NUM_CN[num], x + w / 2, yy + fh * 0.31);
      ctx.fillStyle = INK_RED;
      ctx.font = '700 ' + Math.round(w * 0.44) + 'px "PingFang SC","Microsoft YaHei","SimSun",serif';
      ctx.fillText('萬', x + w / 2, yy + fh * 0.71);
    } else if (suit === 'tong') {
      const pos = PIP_POS[num] || [];
      const gap = minSpacing(pos, iw, ih);
      const rad = Math.max(1.6, Math.min(gap * 0.42, ih * 0.17)) * (num === 1 ? 1.35 : 1);
      for (let i = 0; i < pos.length; i++) {
        drawDot(ix + pos[i][0] * iw, iy + pos[i][1] * ih, rad, dotColor(num, i));
      }
    } else {
      // 条子
      if (num === 1) {
        drawBird(x + w / 2, yy + fh / 2, Math.min(w, fh) * 0.29);
      } else {
        const pos = STICK_POS[num] || [];
        const gap = minSpacing(pos, iw, ih);
        const sh = Math.max(5, Math.min(gap * 1.12, ih * 0.30));
        const sw = Math.max(2.2, sh * 0.44);
        for (let i = 0; i < pos.length; i++) {
          const red = (num === 5 && i === 2) || (num === 7 && i === 0) || (num === 9 && i === 4);
          drawStick(ix + pos[i][0] * iw, iy + pos[i][1] * ih, sw, sh, red ? INK_RED : INK_GREEN);
        }
      }
    }

    ctx.restore();
  }

  // 画牌背
  // 画牌背（同样带厚度与投影）
  function drawTileBack(x, y, w, h) {
    drawTile(0, x, y, w, h, { face: false });
  }

  var TEXTLOG = [];   // 本帧绘制过的文字（版面自检用，标题页有没有挤在一起）

  function drawText(s, x, y, size, color, align, weight) {
    // 记录这一帧画过的所有文字，供版面自检（标题页有没有挤在一起）
    if (TEXTLOG.length < 400) {
      TEXTLOG.push({ s: String(s), x: x, y: y, size: size, align: align || 'left' });
    }
    ctx.save();
    ctx.fillStyle = color || '#f2f6f0';
    ctx.font = (weight || '500') + ' ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
    ctx.restore();
  }

  function drawButton(label, x, y, w, h, opts) {
    opts = opts || {};
    const hot = opts.hot;
    ctx.save();
    const g = ctx.createLinearGradient(x, y, x, y + h);
    if (hot) { g.addColorStop(0, 'rgba(232,196,106,0.96)'); g.addColorStop(1, 'rgba(206,160,60,0.96)'); }
    else { g.addColorStop(0, 'rgba(255,255,255,0.14)'); g.addColorStop(1, 'rgba(255,255,255,0.07)'); }
    ctx.fillStyle = g;
    roundRect(x, y, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = hot ? 'rgba(255,235,180,0.9)' : 'rgba(255,255,255,0.26)';
    ctx.lineWidth = 1.4;
    roundRect(x, y, w, h, h / 2);
    ctx.stroke();
    ctx.fillStyle = hot ? '#1b2a1e' : '#eef6ee';
    ctx.font = '700 ' + Math.round(h * 0.40) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    ctx.restore();
  }

  // 手牌布局：返回每张牌的位置，供点击命中测试使用
  let handHit = [];      // [{x,y,w,h,tile,index}]
  let buttonHit = [];    // [{x,y,w,h,action,label}]
  let discardHit = [];   // [{x,y,w,h,player}] 只用于版面自检
  let meldHit = [];      // [{x,y,w,h,player,kind}] 只用于版面自检

  /* ---- 全屏与静音按钮 ---- */

  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement ||
      document.msFullscreenElement || null;
  }
  function fsSupported() {
    const el = document.documentElement || {};
    return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
  }
  function enterFullscreen() {
    if (fsElement()) return;
    const el = document.documentElement;
    try {
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) { const r = fn.call(el); if (r && r.catch) r.catch(function () { /* 用户拒绝或不允许 */ }); }
      // 手机上顺便尝试锁横屏（不支持 / 被拒绝都不影响游戏）
      if (typeof screen !== 'undefined' && screen && screen.orientation && screen.orientation.lock) {
        const lr = screen.orientation.lock('landscape');
        if (lr && lr.catch) lr.catch(function () { /* 忽略 */ });
      }
    } catch (e) { /* 忽略 */ }
  }
  function exitFullscreen() {
    try {
      const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (fn && fsElement()) {
        const r = fn.call(document);
        if (r && r.catch) r.catch(function () { /* 忽略 */ });
      }
    } catch (e) { /* 忽略 */ }
  }
  function toggleFullscreen() { if (fsElement()) exitFullscreen(); else enterFullscreen(); }

  function drawSysCircle(cx, cy, r, active) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? 'rgba(232,196,106,0.22)' : 'rgba(255,255,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = active ? 'rgba(232,196,106,0.78)' : 'rgba(255,255,255,0.24)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
  }

  // 全屏图标：展开（四角括号朝内）/ 收拢（括号内移、臂朝外）
  function drawFsIcon(cx, cy, inFs) {
    ctx.save();
    ctx.strokeStyle = 'rgba(238,248,238,0.95)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const o = 8, a = 6.5;
    for (const sx of [-1, 1]) {
      for (const sy of [-1, 1]) {
        const vx = cx + sx * (inFs ? o - a : o);
        const vy = cy + sy * (inFs ? o - a : o);
        const dx = inFs ? sx * a : -sx * a;
        const dy = inFs ? sy * a : -sy * a;
        ctx.beginPath();
        ctx.moveTo(vx + dx, vy);
        ctx.lineTo(vx, vy);
        ctx.lineTo(vx, vy + dy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawMuteIcon(cx, cy, isMuted) {
    ctx.save();
    ctx.fillStyle = 'rgba(238,248,238,0.92)';
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy - 3);
    ctx.lineTo(cx - 3, cy - 3);
    ctx.lineTo(cx + 1.5, cy - 7);
    ctx.lineTo(cx + 1.5, cy + 7);
    ctx.lineTo(cx - 3, cy + 3);
    ctx.lineTo(cx - 7, cy + 3);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    if (isMuted) {
      ctx.strokeStyle = 'rgba(255,150,140,0.95)';
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy - 8);
      ctx.lineTo(cx + 9, cy + 8);
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(238,248,238,0.92)';
      ctx.beginPath(); ctx.arc(cx + 2, cy, 5.5, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 2, cy, 9, -0.85, 0.85); ctx.stroke();
    }
    ctx.restore();
  }

  // 右上角的系统按钮（全屏 / 静音），任何界面都可见
  function drawSystemButtons() {
    const r = 20, y = 46;
    const mx = VW - 46;
    drawSysCircle(mx, y, r, false);
    drawMuteIcon(mx, y, muted);
    buttonHit.push({ x: mx - r, y: y - r, w: r * 2, h: r * 2, action: 'mute' });

    if (fsSupported()) {
      const fx = VW - 100;
      const inFs = !!fsElement();
      drawSysCircle(fx, y, r, inFs);
      drawFsIcon(fx, y, inFs);
      buttonHit.push({ x: fx - r, y: y - r, w: r * 2, h: r * 2, action: 'fullscreen' });
    }
  }

  // 桌面图案：交叉斜纹 + 中央回纹环 + 四角纹样（很淡，不抢牌面）
  function drawFeltPattern() {
    ctx.save();
    roundRect(26, 26, VW - 52, VH - 52, 25);
    ctx.clip();

    // 交叉斜纹
    ctx.strokeStyle = 'rgba(226,244,230,0.030)';
    ctx.lineWidth = 1;
    for (let i = -VH; i < VW + VH; i += 38) {
      ctx.beginPath(); ctx.moveTo(i, 26); ctx.lineTo(i + VH, VH - 26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(i, VH - 26); ctx.lineTo(i + VH, 26); ctx.stroke();
    }

    const cx = VW / 2, cy = VH * 0.47;
    // 中央回纹环
    ctx.strokeStyle = 'rgba(232,196,106,0.060)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 172, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 156, 0, Math.PI * 2); ctx.stroke();
    // 环上的小方点
    ctx.fillStyle = 'rgba(232,196,106,0.050)';
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      ctx.save();
      ctx.translate(cx + Math.cos(a) * 164, cy + Math.sin(a) * 164);
      ctx.rotate(a);
      ctx.fillRect(-4, -4, 8, 8);
      ctx.restore();
    }
    // 内圈方框（回纹感）
    ctx.strokeStyle = 'rgba(232,196,106,0.045)';
    ctx.lineWidth = 1.5;
    roundRect(cx - 112, cy - 112, 224, 224, 8); ctx.stroke();
    roundRect(cx - 96, cy - 96, 192, 192, 6); ctx.stroke();

    // 四角纹样
    ctx.strokeStyle = 'rgba(232,196,106,0.075)';
    ctx.lineWidth = 2;
    const cs = [[68, 68, 1, 1], [VW - 68, 68, -1, 1], [68, VH - 68, 1, -1], [VW - 68, VH - 68, -1, -1]];
    for (const c of cs) {
      const px = c[0], py = c[1], sx = c[2], sy = c[3];
      ctx.beginPath();
      ctx.moveTo(px, py + sy * 34);
      ctx.lineTo(px, py);
      ctx.lineTo(px + sx * 34, py);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px + sx * 8, py + sy * 24);
      ctx.lineTo(px + sx * 8, py + sy * 8);
      ctx.lineTo(px + sx * 24, py + sy * 8);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* ---- 联机扩展点（默认全空，单机行为完全不变） ----
   * 联机模式由 server/public/online.js 在运行时装上：
   *   renderOverride() 返回 true 表示这一帧由联机界面自己画
   *   onTap(x, y) 返回 true 表示这次点击已被联机界面处理
   *   sendAction(a, tile) 不为空时，出牌/碰/杠/胡/过 都改由它发送给服务器
   * 注意：用 var 声明，避免上文的暂时性死区问题。 */
  var onlineRenderOverride = null;
  var onlineTap = null;
  var onlineAction = null;

  /* ============================================================
   *  四·五、回合时限：每人 30 秒
   *  单机：本地倒计时，到点自动出牌 / 自动过
   *  联机：时限由服务端强制执行（超时自动出牌/过），本地只显示倒计时
   * ============================================================ */
  var TURN_LIMIT = 30000;
  var clockKey = null;      // 当前「该我决定」的标识，变了就重新计时
  var clockStart = 0;
  var clockAuto = 0;        // 自动代打次数（调试用）

  function myDecision() {
    if (G.phase !== 'playing') return null;
    if (G.pendingClaim) return 'claim';
    if (G.waitingFor === 'discard' || G.waitingFor === 'me') return 'discard';
    return null;
  }

  function clockLeftMs() {
    const kind = myDecision();
    if (!kind || onlineAction) return -1;    // 联机看服务端给的 turnLeft
    const pl = G.players[0];
    const key = kind + ':' + G.turn + ':' + (pl ? pl.hand.length : 0) + ':' +
                (G.lastDiscard ? G.lastDiscard.tile : '-');
    if (key !== clockKey) { clockKey = key; clockStart = Date.now(); }
    const left = TURN_LIMIT - (Date.now() - clockStart);
    return left < 0 ? 0 : left;
  }

  // 超时自动托管：能胡就胡，否则打掉刚摸的那张（没摸就打最后一张），碰杠机会默认过
  function autoPlay() {
    const kind = myDecision();
    if (!kind) return;
    clockAuto++;
    clockKey = null;                       // 重置计时，避免连续触发
    if (kind === 'claim') {
      const opts = (G.pendingClaim && G.pendingClaim.options) || [];
      if (opts.indexOf('hu') >= 0) { doAction('hu'); return; }
      doAction('pass');
      return;
    }
    const pl = G.players[0];
    const tile = (pl && pl.drawn != null) ? pl.drawn
               : (pl && pl.hand.length ? pl.hand[pl.hand.length - 1] : null);
    if (tile == null) return;
    playerDiscard(tile);
  }

  function drawTurnClock() {
    const left = clockLeftMs();
    if (left < 0) return;
    const sec = Math.ceil(left / 1000);
    const w = 168, h = 6;
    const x = VW / 2 - w / 2, y = VH - TH - 74;
    const k = left / TURN_LIMIT;
    ctx.fillStyle = 'rgba(8,26,17,0.55)';
    roundRect(x, y, w, h, 3); ctx.fill();
    ctx.fillStyle = sec <= 10 ? 'rgba(255,120,96,0.95)' : 'rgba(150,240,180,0.85)';
    roundRect(x, y, Math.max(2, w * k), h, 3); ctx.fill();
    drawText('你的回合 · ' + sec + ' 秒', VW / 2, y - 12, 13,
      sec <= 10 ? 'rgba(255,150,130,0.95)' : 'rgba(200,230,215,0.8)', 'center');
  }

  /* ============================================================
   *  四·六、事件观察：出牌 / 碰 / 杠 / 胡 的牌名飘字 + 碰撞声
   *  单机与联机共用——联机时上面那些出牌函数根本不会运行，
   *  所以声音和飘字统一按「状态差异」触发，两种模式都有。
   * ============================================================ */
  const SEAT_ANCHOR = [
    { x: VW / 2, y: VH - 300 },   // 我（牌河在自己上方那一带）
    { x: VW - 300, y: VH / 2 },   // 下家（右）
    { x: VW / 2, y: 150 },        // 对家（上）
    { x: 176, y: VH / 2 }         // 上家（左）
  ];

  var FLOATERS = [];       // [{text, sub, x, y, t0, dur, color, size}]
  var evtSeen = null;      // {discards:[n×4], melds:[n×4], winner}

  function floatText(text, x, y, color, size, sub) {
    FLOATERS.push({
      text: text, sub: sub || '', x: x, y: y,
      t0: Date.now(), dur: 1500,
      color: color || '#ffe9a8', size: size || 26
    });
    if (FLOATERS.length > 12) FLOATERS.shift();
  }

  function meldKind(m) {
    const t = String((m && (m.type || m.kind)) || '');
    if (t.indexOf('kan') >= 0) return 'kan';
    if (t.indexOf('pon') >= 0 || t.indexOf('peng') >= 0) return 'pon';
    return '';
  }

  function seatOfWinner() {
    if (!G.winner) return null;
    const v = (G.winner.p !== undefined) ? G.winner.p : G.winner.seat;
    return (v === undefined) ? null : v;
  }

  // 返回 true 表示这一帧有新事件（用于触发重绘）
  function watchEvents() {
    const ps = G.players;
    if (!ps || !ps[0] || G.phase === 'title') { evtSeen = null; return false; }

    if (!evtSeen) {
      // 第一次看到：只记录状态，不补放历史音效
      evtSeen = {
        discards: ps.map(function (p) { return (p.discards || []).length; }),
        melds: ps.map(function (p) { return (p.melds || []).length; }),
        winner: seatOfWinner()
      };
      return false;
    }

    let fired = false;
    for (let p = 0; p < 4; p++) {
      const pl = ps[p] || {};
      const discs = pl.discards || [];
      const melds = pl.melds || [];
      const a = SEAT_ANCHOR[p];

      // —— 出牌 ——
      if (discs.length > (evtSeen.discards[p] || 0)) {
        floatText(T.label(discs[discs.length - 1]), a.x, a.y - 22, '#ffe9a8', 28);
        if (p === 0) sfxDiscard(); else sfxRivalDiscard();
        fired = true;
      }

      // —— 碰 / 杠 ——
      const dn = melds.length - (evtSeen.melds[p] || 0);
      if (dn > 0) {
        for (let k = 0; k < dn; k++) {
          const m = melds[melds.length - dn + k];
          const kind = meldKind(m);
          const tiles = (m && (m.tiles || m.cards)) || [];
          const nm = tiles.length ? T.label(tiles[0]) : '';
          if (kind === 'kan') {
            floatText('杠', a.x, a.y - 36, '#8fd8ff', 36, nm);
            sfxKan();
          } else if (kind === 'pon') {
            floatText('碰', a.x, a.y - 32, '#ffc978', 34, nm);
            sfxPon();
          }
          fired = true;
        }
      }

      evtSeen.discards[p] = discs.length;
      evtSeen.melds[p] = melds.length;
    }

    // —— 胡牌 / 流局 ——
    const wSeat = seatOfWinner();
    if (wSeat !== evtSeen.winner) {
      evtSeen.winner = wSeat;
      if (wSeat !== null) {
        floatText((G.winner && G.winner.selfDraw) ? '自摸' : '胡', VW / 2, VH * 0.40, '#ffe066', 46);
        if (wSeat === 0) sfxHu(); else sfxOtherWin();
        fired = true;
      } else if (G.phase === 'over') {
        floatText('流局', VW / 2, VH * 0.40, 'rgba(220,235,225,0.9)', 40);
        sfxFlow();
        fired = true;
      }
    }
    return fired;
  }

  function drawFloaters() {
    if (!FLOATERS.length) return;
    const now = Date.now();
    for (let i = FLOATERS.length - 1; i >= 0; i--) {
      const f = FLOATERS[i];
      const age = f.freeze ? 0 : (now - f.t0);
      if (age > f.dur) { FLOATERS.splice(i, 1); continue; }
      const k = f.freeze ? 0.28 : age / f.dur;
      const rise = 1 - Math.pow(1 - k, 2);
      const y = f.y - 54 * rise;
      const alpha = k < 0.1 ? (k / 0.1) : (k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1);
      const scale = k < 0.1 ? 0.74 + 0.26 * (k / 0.1) : 1;

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.translate(f.x, y);
      ctx.scale(scale, scale);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.font = '800 ' + f.size + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(6,26,16,0.8)';
      ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, 0, 0);
      if (f.sub) {
        ctx.font = '700 ' + Math.round(f.size * 0.58) + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
        ctx.lineWidth = 4;
        ctx.strokeText(f.sub, 0, f.size * 0.88);
        ctx.fillStyle = 'rgba(255,248,220,0.95)';
        ctx.fillText(f.sub, 0, f.size * 0.88);
      }
      ctx.restore();
    }
  }

/* ============================================================
   *  九、牌桌背景 / 骰子 / 开场动画（洗牌 · 砌墙 · 掷骰 · 发牌）
   * ============================================================ */

  // 整块背景：木框 + 绒布 + 桌沿 + 暗角，牌桌成了“场景”而不只是块绿布
  function drawTableBase() {
    // 木质后景（铺满整个画面）
    const wg = ctx.createLinearGradient(0, 0, 0, VH);
    wg.addColorStop(0, '#2b1b12');
    wg.addColorStop(0.45, '#3b2517');
    wg.addColorStop(1, '#180f09');
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, VW, VH);

    // 木纹
    ctx.save();
    ctx.lineWidth = 2;
    for (let i = 0; i < 16; i++) {
      const yy = 4 + i * (VH / 15) + Math.sin(i * 1.7) * 4;
      ctx.strokeStyle = 'rgba(150,100,54,' + (0.06 + (i % 3) * 0.028) + ')';
      ctx.beginPath();
      ctx.moveTo(-10, yy);
      ctx.bezierCurveTo(VW * 0.32, yy + 7, VW * 0.68, yy - 8, VW + 10, yy + 4);
      ctx.stroke();
    }
    ctx.restore();

    // 桌沿（外金边 + 内暗边）
    ctx.save();
    roundRect(8, 8, VW - 16, VH - 16, 32);
    ctx.strokeStyle = 'rgba(206,164,96,0.50)';
    ctx.lineWidth = 5;
    ctx.stroke();
    roundRect(16, 16, VW - 32, VH - 32, 28);
    ctx.strokeStyle = 'rgba(255,226,160,0.16)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 绒布
    const g = ctx.createRadialGradient(VW / 2, VH * 0.46, 40, VW / 2, VH * 0.46, VW * 0.62);
    g.addColorStop(0, '#215834');
    g.addColorStop(0.58, '#153c25');
    g.addColorStop(1, '#0a2015');
    ctx.fillStyle = g;
    roundRect(24, 24, VW - 48, VH - 48, 26);
    ctx.fill();

    // 绒布内阴影（上缘压暗，像有桌沿挡着光）
    ctx.save();
    roundRect(24, 24, VW - 48, VH - 48, 26);
    ctx.clip();
    const sh = ctx.createLinearGradient(0, 24, 0, 24 + VH * 0.18);
    sh.addColorStop(0, 'rgba(0,0,0,0.42)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh;
    ctx.fillRect(24, 24, VW - 48, VH * 0.18);
    const sh2 = ctx.createLinearGradient(0, VH - 24 - VH * 0.14, 0, VH - 24);
    sh2.addColorStop(0, 'rgba(0,0,0,0)');
    sh2.addColorStop(1, 'rgba(0,0,0,0.30)');
    ctx.fillStyle = sh2;
    ctx.fillRect(24, VH - 24 - VH * 0.14, VW - 48, VH * 0.14);
    ctx.restore();

    // 金线内框 + 四角包角
    ctx.save();
    ctx.strokeStyle = 'rgba(232,196,106,0.20)';
    ctx.lineWidth = 2;
    roundRect(38, 38, VW - 76, VH - 76, 20);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(232,196,106,0.42)';
    ctx.lineWidth = 3;
    const cnr = 46;
    [[38, 38, 1, 1], [VW - 38, 38, -1, 1], [38, VH - 38, 1, -1], [VW - 38, VH - 38, -1, -1]].forEach(function (c) {
      ctx.beginPath();
      ctx.moveTo(c[0] + c[2] * cnr, c[1]);
      ctx.lineTo(c[0], c[1]);
      ctx.lineTo(c[0], c[1] + c[3] * cnr);
      ctx.stroke();
    });
    ctx.restore();

    // 中央极淡的圆形徽记
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#e8d7a2';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(VW / 2, VH * 0.47, 150, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(VW / 2, VH * 0.47, 128, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      ctx.beginPath();
      ctx.arc(VW / 2 + Math.cos(a) * 139, VH * 0.47 + Math.sin(a) * 139, 9, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    // 暗角
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.42, VW / 2, VH / 2, VH * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, VW, VH);
  }

  /* ---------------- 骰子 ---------------- */

  var DICE_FACE = [
    [],
    [[0.5, 0.5]],
    [[0.29, 0.29], [0.71, 0.71]],
    [[0.29, 0.29], [0.5, 0.5], [0.71, 0.71]],
    [[0.29, 0.29], [0.71, 0.29], [0.29, 0.71], [0.71, 0.71]],
    [[0.29, 0.29], [0.71, 0.29], [0.5, 0.5], [0.29, 0.71], [0.71, 0.71]],
    [[0.29, 0.24], [0.71, 0.24], [0.29, 0.5], [0.71, 0.5], [0.29, 0.76], [0.71, 0.76]]
  ];

  function rollDice() {
    return [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
  }

  // 单颗骰子（正面 + 一点侧面厚度 + 投影 + 点数，带高光）
  function drawDie(cx, cy, s, v, rot, alpha) {
    ctx.save();
    if (alpha != null) ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.rotate(rot || 0);

    // 投影（不跟着旋转，画在旋转前）
    ctx.save();
    ctx.rotate(-(rot || 0) * 0.35);
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(1.5, s * 0.56, s * 0.52, s * 0.17, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 侧面（下移一点的暗色方块 = 厚度）
    ctx.fillStyle = '#bdb093';
    roundRect(-s / 2, -s / 2 + s * 0.09, s, s, s * 0.17);
    ctx.fill();

    // 正面
    const g = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
    g.addColorStop(0, '#fffdf3');
    g.addColorStop(0.55, '#f4ecd8');
    g.addColorStop(1, '#d8ccae');
    ctx.fillStyle = g;
    roundRect(-s / 2, -s / 2, s, s, s * 0.17);
    ctx.fill();

    // 高光
    ctx.save();
    roundRect(-s / 2, -s / 2, s, s, s * 0.17);
    ctx.clip();
    const hl = ctx.createLinearGradient(-s / 2, -s / 2, -s / 2, s * 0.1);
    hl.addColorStop(0, 'rgba(255,255,255,0.72)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(-s / 2, -s / 2, s, s * 0.6);
    ctx.restore();

    // 边框
    ctx.strokeStyle = 'rgba(120,100,70,0.45)';
    ctx.lineWidth = Math.max(1, s * 0.022);
    roundRect(-s / 2, -s / 2, s, s, s * 0.17);
    ctx.stroke();

    // 点数
    const pips = DICE_FACE[v] || [];
    const pr = s * 0.082;
    for (let i = 0; i < pips.length; i++) {
      const px = -s / 2 + pips[i][0] * s;
      const py = -s / 2 + pips[i][1] * s;
      ctx.fillStyle = 'rgba(40,32,24,0.35)';
      ctx.beginPath(); ctx.arc(px + pr * 0.16, py + pr * 0.2, pr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = (v === 1) ? '#b63a2c' : (v === 4) ? '#2f6b45' : '#2b2723';
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath(); ctx.arc(px - pr * 0.32, py - pr * 0.34, pr * 0.32, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------------- 开场动画 ---------------- */

  var INTRO = null;
  var INTRO_MS = { shuffle: 900, wall: 700, dice: 1250, deal: 950 };
  var INTRO_TOTAL = INTRO_MS.shuffle + INTRO_MS.wall + INTRO_MS.dice + INTRO_MS.deal;

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smooth01(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

  function sfxShuffle() {
    const t = nowT();
    if (t === null) return;
    for (let i = 0; i < 9; i++) {
      clack(t + i * 0.088, 0.085 + (i % 3) * 0.018, 1450 + (i % 4) * 130, 0.032, 0.05);
    }
  }

  function sfxDiceLand() {
    const t = nowT();
    if (t === null) return;
    clack(t, 0.17, 880, 0.05, 0.22);
    clack(t + 0.085, 0.12, 760, 0.04, 0.16);
  }

  // 牌墙位置：0 上、1 右、2 下、3 左
  function introWallPos(seg, idx, n) {
    const step = 34;
    const off = (idx - (n - 1) / 2) * step;
    if (seg === 0) return { x: VW / 2 + off, y: 116, w: 26, h: 36 };
    if (seg === 2) return { x: VW / 2 + off, y: VH - 152, w: 26, h: 36 };
    if (seg === 1) return { x: VW - 118, y: VH / 2 + off, w: 36, h: 26 };
    return { x: 118, y: VH / 2 + off, w: 36, h: 26 };
  }

  function startIntro(dice) {
    const pile = [];
    const N = 52;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 * 3 + (i % 5) * 0.31;
      const rr = 26 + (i % 9) * 11;
      pile.push({
        px: VW / 2 + Math.cos(a) * rr * 1.55,
        py: VH * 0.47 + Math.sin(a) * rr * 0.72,
        rot: (((i * 47) % 70) - 35) * Math.PI / 180,
        seg: i % 4,
        idx: Math.floor(i / 4),
        delay: ((i * 7) % 6) * 0.055
      });
    }
    INTRO = {
      t0: Date.now(),
      dice: (dice || []).slice(),
      dealer: G.dealer,
      pile: pile,
      diceSounded: false,
      stage: 'shuffle'
    };
    G.phase = 'intro';
  }

  function finishIntro() {
    INTRO = null;
    G.phase = 'playing';
    recomputeTenpai();
    markDirty();
  }

  // 推进动画：换阶段时发声，结束时进入正式对局
  function advanceIntro() {
    if (!INTRO) { G.phase = 'playing'; return true; }
    if (INTRO.frozen) return true;   // 截图/演示用：把动画定格在某一帧
    const e = Date.now() - INTRO.t0;
    const t1 = INTRO_MS.shuffle, t2 = t1 + INTRO_MS.wall, t3 = t2 + INTRO_MS.dice;
    const stage = e < t1 ? 'shuffle' : e < t2 ? 'wall' : e < t3 ? 'dice' : 'deal';
    if (stage !== INTRO.stage) {
      INTRO.stage = stage;
      if (stage === 'shuffle') sfxShuffle();
    }
    if (stage === 'dice' && !INTRO.diceSounded && e > t2 + INTRO_MS.dice * 0.58) {
      INTRO.diceSounded = true;
      sfxDiceLand();
    }
    if (e >= INTRO_TOTAL) {
      finishIntro();
      return true;
    }
    return true;
  }

  /* ---------------- 四·七 联机开场动画 ----------------
   * 联机的发牌在服务端已经做完了，但玩家仍然想看到「洗牌—砌墙—掷骰—发牌」的过程，
   * 所以这里画一段纯视觉的过场：牌桌由单机逻辑正常绘制，本函数只叠加牌墙与骰子。 */
  var ONLINE_INTRO = null;

  function startOnlineIntro(dice, dealer, name) {
    ONLINE_INTRO = {
      t0: Date.now(),
      dice: dice || [1, 1],
      dealer: dealer || 0,
      name: name || ('电脑·' + SEAT_NAMES[dealer || 0]),
      dur: 2600,
      landed: false
    };
    sfxShuffle();
    markDirty();
    render();
  }

  function skipOnlineIntro() {
    if (!ONLINE_INTRO) return false;
    ONLINE_INTRO = null;
    markDirty();
    return true;
  }

  function onlineIntroActive() {
    if (!ONLINE_INTRO) return false;
    if (Date.now() - ONLINE_INTRO.t0 > ONLINE_INTRO.dur) { ONLINE_INTRO = null; return false; }
    return true;
  }

  function drawOnlineIntro() {
    var it = ONLINE_INTRO;
    if (!it) return;
    var e = Date.now() - it.t0;
    var total = (it.dice[0] + it.dice[1]);
    // 骰子落地那一下给个声音（只响一次）
    if (!it.landed && e > 1050) { it.landed = true; sfxDiceLand(); }

    ctx.save();
    ctx.fillStyle = 'rgba(2,10,7,0.34)';
    ctx.fillRect(0, 0, VW, VH);

    // 一、洗牌：中间一坨牌背随机抖动
    var p1 = Math.min(1, e / 780);
    var n = 44;
    for (var i = 0; i < n; i++) {
      var a = (i * 2.399963) % (Math.PI * 2);
      var rr = 26 + (i % 7) * 9;
      var jx = Math.sin(e / 90 + i) * 7 * (1 - p1 * 0.75);
      var jy = Math.cos(e / 107 + i * 1.7) * 6 * (1 - p1 * 0.75);
      var cx = VW / 2 + Math.cos(a) * rr + jx;
      var cy = VH * 0.42 + Math.sin(a) * rr * 0.62 + jy;
      drawTile(0, cx - 20, cy - 28, 40, 56, { face: false });
    }

    // 二、骰子：从上方落下，落定后弹一下
    var p2 = Math.max(0, Math.min(1, (e - 700) / 420));
    var drop = (1 - p2) * (1 - p2);
    var dy = -180 * drop;
    var s1 = 74, gap = 18;
    drawDie(VW / 2 - s1 / 2 - gap, VH * 0.42 + dy, s1, it.dice[0], (1 - p2) * 3.2, 0.35 + 0.65 * p2);
    drawDie(VW / 2 + s1 / 2 + gap, VH * 0.42 + dy, s1, it.dice[1], -(1 - p2) * 3.6, 0.35 + 0.65 * p2);

    // 三、结果文字
    if (p2 >= 1) {
      drawText('掷骰 ' + it.dice[0] + ' + ' + it.dice[1] + ' = ' + total + ' 点',
        VW / 2, VH * 0.42 + 118, 30, 'rgba(255,236,190,0.98)', 'center', '700');
      drawText(it.name + '坐庄', VW / 2, VH * 0.42 + 158, 24, 'rgba(255,214,120,0.95)', 'center');
    }
    drawText('发牌中…', VW / 2, VH * 0.78, 16, 'rgba(190,226,206,0.75)', 'center');
    drawText('点击任意处跳过', VW / 2, VH - 26, 13, 'rgba(170,206,186,0.55)', 'center');
    ctx.restore();
  }

  function renderIntro() {
    const it = INTRO;
    if (!it) { renderTable(); return; }
    const e = it.frozen ? it.freezeAt : (Date.now() - it.t0);
    const S = INTRO_MS;
    const t1 = S.shuffle, t2 = t1 + S.wall, t3 = t2 + S.dice;

    const q1 = clamp01(e / S.shuffle);
    const q2 = clamp01((e - t1) / S.wall);
    const q3 = clamp01((e - t2) / S.dice);
    const q4 = clamp01((e - t3) / S.deal);

    // 阶段提示
    let label = '洗牌', sub = '把牌搓匀，谁也猜不到下一张';
    if (e >= t1) { label = '砌墙'; sub = '四家各码一列牌墙'; }
    if (e >= t2) { label = '掷骰子'; sub = '点数决定谁坐庄'; }
    if (e >= t3) { label = '发牌'; sub = '各十三张，庄家多摸一张'; }
    drawText(label, VW / 2, VH * 0.255, 30, 'rgba(255,232,170,0.95)', 'center', '700');
    drawText(sub, VW / 2, VH * 0.255 + 30, 15, 'rgba(200,220,208,0.72)', 'center');

    // 牌堆 → 牌墙
    const jit = 15 * (1 - q1);
    for (let i = 0; i < it.pile.length; i++) {
      const t = it.pile[i];
      let x = t.px + Math.sin(e / 85 + i * 1.7) * jit;
      let y = t.py + Math.cos(e / 105 + i * 2.3) * jit * 0.72;
      let w = 30, h = 42, rot = t.rot;
      if (q2 > 0) {
        const wp = introWallPos(t.seg, t.idx, 13);
        const k = smooth01((q2 - t.delay) / (1 - t.delay * 0.9 || 1));
        x = x + (wp.x - x) * k;
        y = y + (wp.y - y) * k;
        w = w + (wp.w - w) * k;
        h = h + (wp.h - h) * k;
        rot = rot * (1 - k);
      }
      let alpha = 1;
      if (q4 > 0) {
        alpha = 1 - clamp01((q4 - t.idx / 30) * 1.7);
        if (alpha <= 0) continue;
      }
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(rot);
      drawTileBack(-w / 2, -h / 2, w, h);
      ctx.restore();
    }

    // 骰子
    if (e >= t2) {
      const drop = clamp01(q3 / 0.55);
      const yy0 = -140;
      const yBase = VH * 0.455;
      let yy = yy0 + (yBase - yy0) * smooth01(drop);
      const settled = q3 > 0.55;
      if (settled) {
        const k = (q3 - 0.55) / 0.45;
        yy -= Math.abs(Math.sin(k * Math.PI * 3.2)) * 9 * (1 - k);
      }
      const s = Math.min(VW, VH) * 0.135;
      const rot1 = (1 - q3) * Math.PI * 2.3 + 0.12;
      const rot2 = (1 - q3) * -Math.PI * 1.9 - 0.18;
      drawDie(VW / 2 - s * 0.78, yy, s, it.dice[0], rot1);
      drawDie(VW / 2 + s * 0.78, yy, s, it.dice[1], rot2);

      if (q3 > 0.62) {
        const a = clamp01((q3 - 0.62) / 0.38);
        const total = it.dice[0] + it.dice[1];
        ctx.save();
        ctx.globalAlpha = a;
        drawText(total + ' 点', VW / 2, yy + s * 1.05, 28, '#ffe8aa', 'center', '800');
        drawText(SEAT_NAMES[it.dealer] + '坐庄', VW / 2, yy + s * 1.05 + 30, 18, 'rgba(255,240,200,0.9)', 'center');
        if (it.dealer === 0) {
          drawText('你先出牌', VW / 2, yy + s * 1.05 + 54, 14, 'rgba(160,240,190,0.9)', 'center');
        }
        ctx.restore();
      }
    }

    // 发牌：自己的手牌一张张落位
    if (q4 > 0) {
      const n = Math.round(q4 * 14);
      const tw = TW * 0.60, th = TH * 0.60, gap = 4;
      const totalW = 14 * (tw + gap) - gap;
      let x = VW / 2 - totalW / 2;
      const y = VH - th - 44;
      for (let i = 0; i < n; i++) {
        const ap = clamp01((q4 - i / 16) * 3.2);
        ctx.save();
        ctx.globalAlpha = ap;
        drawTileBack(x, y - (1 - ap) * 30, tw, th);
        ctx.restore();
        x += tw + gap;
      }
    }

    drawText('点击任意处跳过', VW / 2, VH - 26, 12, 'rgba(200,220,208,0.45)', 'center');
  }

  // 重开一局：掷骰定庄 → 可选开场动画
  function beginRound(skipIntro) {
    const d = rollDice();
    resetGame(d);
    recomputeTenpai();
    if (skipIntro) {
      INTRO = null;
      G.phase = 'playing';
    } else {
      startIntro(d);
    }
    markDirty();
  }

  function render() {
    applyTransform();
    if (onlineRenderOverride && onlineRenderOverride()) return;
    // 开场动画期间只画动画，不画牌桌
    if (G.phase === 'intro') {
      TEXTLOG.length = 0;
      handHit = []; buttonHit = []; discardHit = []; meldHit = [];
      drawTableBase();
      drawFeltPattern();
      renderIntro();
      drawSystemButtons();
      return;
    }
    // 每帧先看看有没有新事件（出牌 / 碰 / 杠 / 胡），有就补上飘字与声音。
    // 差异式实现，重复调用不会重复触发。
    watchEvents();
    renderScene();
  }

  // 只画牌桌本身（不含「这一帧要不要画」的判断），联机界面重绘时也调它
  function renderScene() {
    TEXTLOG.length = 0;

    // 牌桌场景（木框 + 绒布 + 桌沿 + 暗角）
    drawTableBase();

    // 桌面图案
    drawFeltPattern();

    // 右下角极淡的构建标记
    drawText('build ' + BUILD, VW / 2, VH - 9, 9, 'rgba(200,220,208,0.26)', 'center');

    handHit = [];
    buttonHit = [];
    discardHit = [];
    meldHit = [];

    if (G.phase === 'title') {
      renderTitle();
    } else {
      renderTable();
      if (G.phase === 'over') renderOver();
    }
    drawTurnClock();
    drawFloaters();
    if (ONLINE_INTRO) drawOnlineIntro();
    drawSystemButtons();
  }

  function renderTitle() {
    drawText('大众麻将', VW / 2, VH * 0.30, 66, '#f6efd8', 'center', '800');
    drawText('四组合一对，即可胡牌', VW / 2, VH * 0.40, 22, 'rgba(232,196,106,0.9)', 'center', '500');

    const cx = VW / 2;
    drawText('玩法：与三个电脑对局 · 点手牌出牌 · 碰 / 杠 / 胡会自动出现按钮', cx, VH * 0.52, 17, 'rgba(200,220,208,0.75)', 'center');
    drawText('本玩法不含「吃」 · 手机可全屏玩 · 右上角可开关声音', cx, VH * 0.585, 17, 'rgba(200,220,208,0.75)', 'center');
    drawText('每人 30 秒思考时间 · 超时会替你自动出牌', cx, VH * 0.632, 17, 'rgba(255,214,120,0.85)', 'center');
    drawText('目标：凑齐四组面子（顺子或刻子）+ 一对将', cx, VH * 0.682, 16, 'rgba(200,220,208,0.55)', 'center');
    drawText('开局掷骰定庄 · 洗牌 / 砌墙 / 发牌动画', cx, VH * 0.722, 14, 'rgba(180,235,205,0.62)', 'center');

    const bw = 200, bh = 58;
