<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>回声 · ECHO</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #0b1728 0%, #03050a 65%);
    overflow: hidden;
    /* 移动端：禁止长按选中、双击缩放、下拉刷新 */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #wrap {
    width: min(96vw, 153.6vh);
    aspect-ratio: 8 / 5;
  }
  /* 移动浏览器地址栏伸缩时 vh 不等于可视高度，优先用 dvh */
  @supports (height: 100dvh) {
    #wrap { width: min(96vw, 153.6dvh); }
    body.landscape-mode #wrap { width: min(100vw, 160dvh); }
  }
  canvas {
    display: block; width: 100%; height: 100%;
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(120, 200, 255, 0.10), 0 24px 90px -20px rgba(0, 180, 255, 0.35);
    touch-action: none;
  }

  /* 竖屏提示：完全由 JS 控制显隐（body.tip-on）。
     不再用 CSS orientation 媒体查询——部分手机浏览器/WebView 旋转时
     不更新该查询，会出现"横屏了提示还在"。也不再模糊画面。 */
  #rotate-tip {
    display: none;
    position: fixed; inset: 0; z-index: 2147483600;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 22px;
    background: rgba(3, 6, 12, 0.86);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #e8f4ff; text-align: center; padding: 24px;
  }
  body.tip-on #rotate-tip { display: flex; }
  #rotate-tip .phone {
    width: 74px; height: 128px; border-radius: 14px;
    border: 3px solid rgba(120, 220, 255, 0.85);
    box-shadow: 0 0 34px -6px rgba(95, 240, 255, 0.7);
    animation: rot 2.4s ease-in-out infinite;
    position: relative;
  }
  #rotate-tip .phone::after {
    content: ""; position: absolute; left: 50%; bottom: 7px;
    width: 26px; height: 3px; border-radius: 2px;
    background: rgba(120, 220, 255, 0.6); transform: translateX(-50%);
  }
  #rotate-tip b { font-size: 19px; font-weight: 700; letter-spacing: .02em; }
  #rotate-tip span { font-size: 13.5px; color: rgba(150, 195, 225, 0.8); line-height: 1.7; }
  #rotate-tip .skip {
    margin-top: 6px; font-size: 13px; padding: 9px 20px; cursor: pointer;
    color: #9fe8ff; background: rgba(95, 240, 255, 0.08);
    border: 1px solid rgba(95, 240, 255, 0.3); border-radius: 999px;
    font-family: inherit;
  }
  #rotate-tip .skip:active { background: rgba(95, 240, 255, 0.18); }
  @keyframes rot {
    0%, 35% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #rotate-tip .phone { animation: none; transform: rotate(-90deg); }
  }

  /* 横屏手机：铺满整个视口，去掉圆角和阴影，画面更大更清楚 */
  body.landscape-mode #wrap {
    width: min(100vw, 160vh);
    aspect-ratio: 8 / 5;
  }
  body.landscape-mode canvas {
    border-radius: 0;
    box-shadow: none;
  }

  /* 全屏：铺满整个屏幕，并隐藏导航浮标 */
  body.fullscreen-mode #wrap {
    width: min(100vw, 160dvh);
    aspect-ratio: 8 / 5;
  }
  body.fullscreen-mode canvas {
    border-radius: 0;
    box-shadow: none;
  }
  body.fullscreen-mode #hub-nav { display: none; }
</style>

<style data-hub-nav="css">
  #hub-nav {
    position: fixed; top: 14px; left: 14px; z-index: 2147483000;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px 7px 11px; border-radius: 999px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 12.5px; font-weight: 600; line-height: 1;
    color: #dff6ff; text-decoration: none; cursor: pointer;
    background: rgba(8, 16, 28, 0.62);
    border: 1px solid rgba(120, 200, 255, 0.28);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 22px -8px rgba(0, 0, 0, 0.75);
    opacity: 0.55; transition: opacity .2s, transform .2s, border-color .2s;
  }
  #hub-nav:hover, #hub-nav:focus-visible {
    opacity: 1; transform: translateY(-1px);
    border-color: rgba(120, 200, 255, 0.65);
    outline: none;
  }
  #hub-nav svg { width: 13px; height: 13px; flex: none; }

  /* 浅色背景的游戏（如 2048）加 class="hub-nav-light" 覆盖配色。
     注入时脚本会自动检测背景色并加上这个 class。 */
  #hub-nav.hub-nav-light {
    color: #3a332c;
    background: rgba(255, 255, 255, 0.82);
    border-color: rgba(120, 100, 80, 0.28);
    box-shadow: 0 6px 20px -8px rgba(90, 75, 60, 0.45);
  }
  #hub-nav.hub-nav-light:hover, #hub-nav.hub-nav-light:focus-visible {
    border-color: rgba(120, 100, 80, 0.55);
  }
  @media (max-width: 560px) {
    #hub-nav { top: 10px; left: 10px; padding: 6px 11px 6px 9px; font-size: 12px; }
  }
  @media print { #hub-nav { display: none; } }
</style>
</head>
<body>
<a id="hub-nav" href="../index.html" title="返回游戏小屋" aria-label="返回游戏小屋">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
游戏小屋
</a>

<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>

<div id="rotate-tip">
  <div class="phone"></div>
  <b>请把手机横过来</b>
  <span>《回声》是宽屏游戏，横屏才能看清战场<br>把手机转为横向即可自动开始</span>
  <button class="skip" id="rotate-skip">竖屏也能玩，继续</button>
</div>
<script>
(function () {
  'use strict';

  /* ==========================================================
     回声 · ECHO
     ----------------------------------------------------------
     核心机制
       你每次按下空格，游戏会把你「过去 1.4 秒的移动轨迹」复制成
       一个回声。回声会沿着那条轨迹来回巡逻，它可以：
         - 替你吸收飞行中的子弹（回声不会受伤，但有寿命）
         - 替你收集光点（光点是能量与分数的来源）
       于是你的走位不只是躲子弹，而是在「布置未来」：
       走过的路会被回收成一面会移动的盾，也是一个自动收集器。
     能量槽满 28 才能召唤，最多同时存在 3 个回声。
     ========================================================== */

  const W = 960;
  const H = 600;
  const TAU = Math.PI * 2;
  const FONT = '"Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  let dpr = 1;

  function fit() {
    // 用真实 dpr 渲染，上限 3，避免高分屏被降采样导致发虚
    const raw = window.devicePixelRatio || 1;
    dpr = Math.min(3, Math.max(1, raw));
    const bw = Math.round(W * dpr);
    const bh = Math.round(H * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
  }
  fit();
  window.addEventListener('resize', fit);

  /* ---------------- 工具 ---------------- */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function d2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

  function glowSprite(r, g, b) {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const grd = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
    grd.addColorStop(0.4, 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
    grd.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    x.fillStyle = grd;
    x.fillRect(0, 0, size, size);
    return c;
  }

  const SPR = {
    cyan: glowSprite(90, 240, 255),
    blue: glowSprite(125, 185, 255),
    red: glowSprite(255, 70, 105),
    gold: glowSprite(255, 205, 95),
    violet: glowSprite(175, 140, 255),
    white: glowSprite(235, 250, 255)
  };

  function glow(img, x, y, r, a) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------------- 音效（WebAudio 合成，无外部资源） ---------------- */
  let AC = null;
  let master = null;
  let noiseBuf = null;
  let muted = false;

  function initAudio() {
    if (AC) {
      if (AC.state === 'suspended') AC.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      AC = new Ctx();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.3;
      master.connect(AC.destination);

      const len = Math.floor(AC.sampleRate * 0.6);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (err) {
      AC = null;
      master = null;
    }
  }

  function beep(freq, dur, type, vol, slideTo, delay) {
    if (!AC || muted) return;
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }

  function hiss(dur, vol, delay) {
    if (!AC || muted || !noiseBuf) return;
    const t0 = AC.currentTime + (delay || 0);
    const src = AC.createBufferSource();
    src.buffer = noiseBuf;
    const f = AC.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(2200, t0);
    f.frequency.exponentialRampToValueAtTime(180, t0 + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  /* ---------------- 预渲染背景 ---------------- */
  const bg = document.createElement('canvas');
  bg.width = W * 2;
  bg.height = H * 2;
  (function paintBg() {
    const g = bg.getContext('2d');
    g.scale(2, 2);
    const grd = g.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, '#070c16');
    grd.addColorStop(0.5, '#0a1220');
    grd.addColorStop(1, '#05070e');
    g.fillStyle = grd;
    g.fillRect(0, 0, W, H);

    const rg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 620);
    rg.addColorStop(0, 'rgba(36, 96, 150, 0.22)');
    rg.addColorStop(0.6, 'rgba(20, 50, 90, 0.08)');
    rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    g.strokeStyle = 'rgba(96, 168, 224, 0.055)';
    g.lineWidth = 1;
    for (let x = 0; x <= W; x += 48) {
      g.beginPath();
      g.moveTo(x + 0.5, 0);
      g.lineTo(x + 0.5, H);
      g.stroke();
    }
    for (let y = 0; y <= H; y += 48) {
      g.beginPath();
      g.moveTo(0, y + 0.5);
      g.lineTo(W, y + 0.5);
      g.stroke();
    }

    g.strokeStyle = 'rgba(120, 205, 255, 0.09)';
    g.lineWidth = 2;
    g.strokeRect(1, 1, W - 2, H - 2);
  })();

  const vig = document.createElement('canvas');
  vig.width = W * 2;
  vig.height = H * 2;
  (function paintVig() {
    const g = vig.getContext('2d');
    g.scale(2, 2);
    const rg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.72);
    rg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    rg.addColorStop(1, 'rgba(0, 0, 0, 0.75)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
  })();

  /* ---------------- 状态 ---------------- */
  let state = 'title';        // title | playing | over
  let paused = false;
  let score = 0;
  let wave = 1;
  let hearts = 3;
  let elapsed = 0;
  let shake = 0;
  let charge = 45;
  let chargeFlash = 0;
  let announce = null;
  let tNow = 0;
  let best = 0;
  try { best = parseInt(window.localStorage.getItem('echo_best') || '0', 10) || 0; } catch (err) { best = 0; }

  const SUMMON_COST = 28;
  const MAX_ECHO = 3;
  const REC_DT = 1 / 60;
  const REC_MAX = 84;          // 1.4 秒轨迹

  const player = {
    x: W / 2, y: H / 2, vx: 0, vy: 0, r: 9,
    invuln: 0, dashT: 0, dashCD: 0, dvx: 0, dvy: 0
  };

  /* ---------------- 触屏输入状态 ----------------
     左下角虚拟摇杆输出一个方向向量，与键盘输入相加后一起参与移动。 */
  const touch = {
    active: false,     // 是否正在拖动摇杆
    pointerId: null,
    ox: 0, oy: 0,      // 摇杆基座（逻辑坐标）
    cx: 0, cy: 0,      // 摇杆头当前位置
    dx: 0, dy: 0,      // 归一化方向
    mag: 0             // 推杆幅度 0~1
  };
  const JOY_RADIUS = 68;   // 摇杆最大拖拽半径
  const JOY_DEAD = 0.2;    // 死区，避免手指轻触就走动

  // 触屏按钮的命中区域（逻辑坐标），在 drawTouchUI 里同步绘制
  const BTN = {
    summon: { x: W - 96, y: H - 96, r: 52, label: '回声' },
    dash: { x: W - 196, y: H - 62, r: 38, label: '冲刺' },
    full: { x: W - 46, y: 104, r: 22, label: '全屏' }
  };
  const btnPulse = { summon: 0, dash: 0, full: 0 };  // 按下反馈动画

  let isTouch = false;      // 是否检测到触屏设备
  let touchHintT = 0;       // 触屏操作提示的显示计时
  let isFullscreen = false; // 是否处于全屏
  let fsBlocked = false;    // 浏览器拒绝/不支持全屏时置位

  const echoes = [];
  const bullets = [];
  const orbs = [];
  const sentinels = [];
  const parts = [];
  const rings = [];
  const texts = [];
  const recBuf = [];
  const keys = new Set();

  let recT = 0;
  let orbT = 0;

  /* ---------------- 回声 ---------------- */
  class Echo {
    constructor(path) {
      this.path = path;
      this.i = Math.max(0, path.length - 1);
      this.dir = -1;
      this.life = 9.5;
      this.max = 9.5;
      this.flash = 0;
      this.x = path[this.i].x;
      this.y = path[this.i].y;
    }
    update(dt) {
      this.life -= dt;
      this.flash = Math.max(0, this.flash - dt * 4);
      const n = this.path.length;
      if (n > 1) {
        this.i += this.dir * dt * 60;
        if (this.i <= 0) { this.i = 0; this.dir = 1; }
        else if (this.i >= n - 1) { this.i = n - 1; this.dir = -1; }
        const i0 = Math.floor(this.i);
        const i1 = Math.min(i0 + 1, n - 1);
        const f = this.i - i0;
        const a = this.path[i0];
        const b = this.path[i1];
        this.x = lerp(a.x, b.x, f);
        this.y = lerp(a.y, b.y, f);
      }
      return this.life > 0;
    }
  }

  /* ---------------- 特效 ---------------- */
  function burst(x, y, n, sprite, spd, life, size) {
    spd = spd || 180;
    life = life || 0.6;
    size = size || 3;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU);
      const s = rnd(0.25, 1) * spd;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rnd(life * 0.55, life),
        max: life,
        size: rnd(1.4, size),
        sprite: sprite
      });
    }
  }

  function ring(x, y, r0, r1, life, color) {
    rings.push({ x: x, y: y, r0: r0, r1: r1, life: life, max: life, color: color });
  }

  function addText(x, y, text, color, size) {
    texts.push({ x: x, y: y, text: text, color: color, size: size, life: 0.95, max: 0.95, vy: -36 });
  }

  /* ---------------- 生成物 ---------------- */
  function spawnOrb() {
    let x = 0, y = 0;
    for (let i = 0; i < 30; i++) {
      x = rnd(70, W - 70);
      y = rnd(70, H - 70);
      if (d2(x, y, player.x, player.y) > 130 * 130) break;
    }
    const a = rnd(0, TAU);
    const sp = rnd(18, 46);
    orbs.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      r: 7,
      life: 16,
      max: 16,
      ph: rnd(0, TAU)
    });
  }

  function spawnSentinel() {
    const m = 36;
    let x = 0, y = 0;
    for (let i = 0; i < 24; i++) {
      const side = Math.floor(rnd(0, 4));
      if (side === 0) { x = rnd(m, W - m); y = m; }
      else if (side === 1) { x = W - m; y = rnd(m, H - m); }
      else if (side === 2) { x = rnd(m, W - m); y = H - m; }
      else { x = m; y = rnd(m, H - m); }
      if (d2(x, y, player.x, player.y) > 170 * 170) break;
    }
    sentinels.push({
      x: x, y: y,
      cool: rnd(1.2, 2.6),
      pending: false,
      tele: 0,
      spin: rnd(0, TAU)
    });
  }

  /* ---------------- 玩法事件 ---------------- */
  function collect(o, byEcho) {
    const gain = byEcho ? 6 : 10;
    score += gain;
    charge = Math.min(100, charge + (byEcho ? 7 : 9));
    burst(o.x, o.y, byEcho ? 8 : 12, SPR.gold, 170, 0.5, 2.8);
    ring(o.x, o.y, 5, byEcho ? 44 : 60, 0.45, 'rgba(255,205,110,0.85)');
    addText(o.x, o.y - 10, '+' + gain, byEcho ? '#9fd8ff' : '#ffd98a', byEcho ? 12 : 14);
    beep(byEcho ? 620 : 860, 0.09, 'sine', 0.09, byEcho ? 820 : 1240);
  }

  function absorb(b, e) {
    e.flash = 1;
    charge = Math.min(100, charge + 2.5);
    score += 2;
    burst(b.x, b.y, 6, SPR.white, 130, 0.35, 2);
    ring(b.x, b.y, 4, 26, 0.3, 'rgba(170,225,255,0.8)');
    beep(340, 0.06, 'square', 0.06);
  }

  function summonEcho() {
    if (state !== 'playing' || paused) return;
    if (charge < SUMMON_COST) {
      chargeFlash = 0.45;
      beep(150, 0.12, 'square', 0.06, 90);
      return;
    }
    if (recBuf.length < 4) return;

    charge -= SUMMON_COST;
    const path = [];
    const startIdx = Math.max(0, recBuf.length - REC_MAX);
    for (let i = startIdx; i < recBuf.length; i++) {
      path.push({ x: recBuf[i].x, y: recBuf[i].y });
    }

    echoes.push(new Echo(path));
    if (echoes.length > MAX_ECHO) {
      const old = echoes.shift();
      burst(old.x, old.y, 12, SPR.blue, 130, 0.6, 2.6);
    }

    ring(player.x, player.y, 10, 112, 0.55, 'rgba(130,235,255,0.85)');
    ring(player.x, player.y, 6, 60, 0.35, 'rgba(180,245,255,0.9)');
    burst(player.x, player.y, 10, SPR.cyan, 120, 0.4, 2);
    beep(300, 0.26, 'sine', 0.16, 660);
    beep(680, 0.3, 'triangle', 0.07, 1020, 0.03);
    shake = Math.max(shake, 3);
    addText(player.x, player.y - 20, '回声', '#9df2ff', 14);
  }

  function dash() {
    if (state !== 'playing' || paused) return;
    if (player.dashCD > 0) return;
    let dx = player.vx, dy = player.vy;
    if (Math.hypot(dx, dy) < 30) { dx = 0; dy = -1; }
    const len = Math.hypot(dx, dy) || 1;
    dx /= len;
    dy /= len;
    player.dashT = 0.12;
    player.dashCD = 1.05;
    player.invuln = Math.max(player.invuln, 0.2);
    player.dvx = dx * 980;
    player.dvy = dy * 980;
    beep(520, 0.14, 'sine', 0.12, 980);
    burst(player.x, player.y, 8, SPR.cyan, 160, 0.35, 2.2);
  }

  function hitPlayer() {
    if (player.invuln > 0 || player.dashT > 0) return;
    hearts--;
    player.invuln = 1.7;
    shake = 16;
    hiss(0.4, 0.3);
    beep(120, 0.5, 'sawtooth', 0.2, 50);
    burst(player.x, player.y, 26, SPR.red, 240, 0.8, 3.4);
    ring(player.x, player.y, 10, 160, 0.6, 'rgba(255,90,120,0.85)');

    for (let i = bullets.length - 1; i >= 0; i--) {
      if (d2(bullets[i].x, bullets[i].y, player.x, player.y) < 150 * 150) {
        burst(bullets[i].x, bullets[i].y, 4, SPR.white, 100, 0.3, 2);
        bullets.splice(i, 1);
      }
    }
    for (let i = 0; i < echoes.length; i++) {
      burst(echoes[i].x, echoes[i].y, 10, SPR.blue, 140, 0.5, 2.4);
    }
    echoes.length = 0;

    if (hearts <= 0) endGame();
  }

  /* 玩家中弹时，把清场工作延后到子弹循环之外执行，
     避免在遍历 bullets 的过程中修改同一个数组。 */
  let pendingHit = false;

  function flushPendingHit() {
    if (!pendingHit) return;
    pendingHit = false;
    hitPlayer();
  }

  function fireInterval() {
    return Math.max(0.95, 2.7 - wave * 0.19) * rnd(0.82, 1.22);
  }

  function fireFrom(s) {
    const speed = 170 + wave * 9;
    const dx = player.x - s.x;
    const dy = player.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    const lead = Math.min(0.45, dist / speed) * 0.55;
    const tx = player.x + player.vx * lead;
    const ty = player.y + player.vy * lead;
    const base = Math.atan2(ty - s.y, tx - s.x);
    const shots = wave >= 6 ? 3 : 1;

    for (let k = 0; k < shots; k++) {
      const a = base + (k - (shots - 1) / 2) * 0.15;
      bullets.push({
        x: s.x,
        y: s.y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        r: 5.5,
        life: 7,
        trail: []
      });
    }
    beep(180, 0.08, 'square', 0.045, 120);
  }

  function onWave() {
    const total = Math.min(7, 3 + Math.floor(wave / 2));
    while (sentinels.length < total) spawnSentinel();

    if (wave % 3 === 0 && hearts < 5) {
      hearts++;
      addText(W / 2, H / 2 + 80, '心之回响 +1', '#8dffc8', 18);
    }

    announce = {
      text: '第 ' + wave + ' 波',
      sub: wave % 3 === 0 ? '拾回一段心之回响' : '回声更汹涌了',
      life: 2.3,
      max: 2.3
    };
    ring(W / 2, H / 2, 30, 420, 1.1, 'rgba(120,220,255,0.5)');
    beep(220 + wave * 16, 0.45, 'triangle', 0.14, 420 + wave * 16);
  }

  function resetRun() {
    score = 0;
    wave = 1;
    hearts = 3;
    elapsed = 0;
    shake = 0;
    charge = 45;
    chargeFlash = 0;
    paused = false;
    announce = null;
    recT = 0;
    orbT = 0;

    echoes.length = 0;
    bullets.length = 0;
    orbs.length = 0;
    sentinels.length = 0;
    parts.length = 0;
    rings.length = 0;
    texts.length = 0;
    recBuf.length = 0;

    player.x = W / 2;
    player.y = H / 2;
    player.vx = 0;
    player.vy = 0;
    player.invuln = 0;
    player.dashT = 0;
    player.dashCD = 0;

    for (let i = 0; i < 5; i++) spawnOrb();
    for (let i = 0; i < 3; i++) spawnSentinel();
  }

  function startGame() {
    resetRun();
    state = 'playing';
    announce = { text: '回声', sub: '你的过去会替你挡下子弹', life: 2.4, max: 2.4 };
    beep(440, 0.3, 'sine', 0.16, 880);
    ring(W / 2, H / 2, 20, 300, 0.9, 'rgba(120,235,255,0.7)');
  }

  function endGame() {
    state = 'over';
    paused = false;
    if (score > best) {
      best = score;
      try { window.localStorage.setItem('echo_best', String(best)); } catch (err) { /* 忽略 */ }
    }
    burst(player.x, player.y, 44, SPR.cyan, 320, 1.1, 4);
    burst(player.x, player.y, 26, SPR.violet, 220, 0.9, 3);
    ring(player.x, player.y, 10, 400, 1.0, 'rgba(140,235,255,0.8)');
    shake = 22;
    hiss(0.6, 0.28);
    beep(180, 0.8, 'sine', 0.18, 40);
    announce = null;
  }

  /* ---------------- 更新 ---------------- */
  function updatePlayer(dt) {
    let ix = 0, iy = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) ix -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) ix += 1;
    if (keys.has('ArrowUp') || keys.has('KeyW')) iy -= 1;
    if (keys.has('ArrowDown') || keys.has('KeyS')) iy += 1;

    // 触屏摇杆：方向叠加到键盘输入上
    if (touch.active && touch.mag > JOY_DEAD) {
      ix += touch.dx;
      iy += touch.dy;
    }

    const len = Math.hypot(ix, iy);
    if (len > 0) { ix /= len; iy /= len; }

    player.dashCD = Math.max(0, player.dashCD - dt);
    player.invuln = Math.max(0, player.invuln - dt);

    if (player.dashT > 0) {
      player.dashT -= dt;
      player.x += player.dvx * dt;
      player.y += player.dvy * dt;
      parts.push({
        x: player.x, y: player.y,
        vx: rnd(-24, 24), vy: rnd(-24, 24),
        life: 0.3, max: 0.3, size: 3.4, sprite: SPR.cyan
      });
      if (player.dashT <= 0) {
        player.vx = player.dvx * 0.28;
        player.vy = player.dvy * 0.28;
      }
    } else {
      const ACC = 2500;
      player.vx += ix * ACC * dt;
      player.vy += iy * ACC * dt;
      const damp = Math.exp(-dt * 8.5);
      player.vx *= damp;
      player.vy *= damp;
      const sp = Math.hypot(player.vx, player.vy);
      const MAXSP = 300;
      if (sp > MAXSP) {
        player.vx *= MAXSP / sp;
        player.vy *= MAXSP / sp;
      }
      player.x += player.vx * dt;
      player.y += player.vy * dt;
    }

    const m = 18;
    if (player.x < m) { player.x = m; if (player.vx < 0) player.vx *= -0.4; }
    else if (player.x > W - m) { player.x = W - m; if (player.vx > 0) player.vx *= -0.4; }
    if (player.y < m) { player.y = m; if (player.vy < 0) player.vy *= -0.4; }
    else if (player.y > H - m) { player.y = H - m; if (player.vy > 0) player.vy *= -0.4; }
  }

  function updateFx(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].life -= dt;
      if (rings[i].life <= 0) rings.splice(i, 1);
    }
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.life -= dt;
      t.y += t.vy * dt;
      if (t.life <= 0) texts.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 42);
    if (chargeFlash > 0) chargeFlash = Math.max(0, chargeFlash - dt);
    if (btnPulse.summon > 0) btnPulse.summon = Math.max(0, btnPulse.summon - dt * 4);
    if (btnPulse.dash > 0) btnPulse.dash = Math.max(0, btnPulse.dash - dt * 4);
    if (btnPulse.full > 0) btnPulse.full = Math.max(0, btnPulse.full - dt * 4);
    if (touchHintT > 0) touchHintT = Math.max(0, touchHintT - dt);
    if (announce) {
      announce.life -= dt;
      if (announce.life <= 0) announce = null;
    }
  }

  function update(dt) {
    updateFx(dt);
    if (state !== 'playing') return;

    elapsed += dt;
    const nw = 1 + Math.floor(elapsed / 16);
    if (nw > wave) { wave = nw; onWave(); }

    updatePlayer(dt);

    recT += dt;
    while (recT >= REC_DT) {
      recT -= REC_DT;
      recBuf.push({ x: player.x, y: player.y });
      if (recBuf.length > REC_MAX) recBuf.shift();
    }

    for (let i = echoes.length - 1; i >= 0; i--) {
      const e = echoes[i];
      if (!e.update(dt)) {
        burst(e.x, e.y, 16, SPR.blue, 150, 0.7, 3);
        echoes.splice(i, 1);
      }
    }

    /* 光点 */
    orbT -= dt;
    if (orbT <= 0) {
      orbT = 1.15;
      if (orbs.length < 5) spawnOrb();
    }
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.life -= dt;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      if (o.x < 42) { o.x = 42; o.vx = Math.abs(o.vx); }
      else if (o.x > W - 42) { o.x = W - 42; o.vx = -Math.abs(o.vx); }
      if (o.y < 42) { o.y = 42; o.vy = Math.abs(o.vy); }
      else if (o.y > H - 42) { o.y = H - 42; o.vy = -Math.abs(o.vy); }
      if (o.life <= 0) { orbs.splice(i, 1); continue; }

      const pr = o.r + player.r + 4;
      if (d2(o.x, o.y, player.x, player.y) < pr * pr) {
        collect(o, false);
        orbs.splice(i, 1);
        continue;
      }
      let taken = false;
      for (let k = 0; k < echoes.length; k++) {
        const e = echoes[k];
        const er = o.r + 13;
        if (d2(o.x, o.y, e.x, e.y) < er * er) {
          collect(o, true);
          taken = true;
          break;
        }
      }
      if (taken) orbs.splice(i, 1);
    }

    /* 哨兵 */
    for (let i = 0; i < sentinels.length; i++) {
      const s = sentinels[i];
      s.spin += dt * 0.9;
      if (s.pending) {
        s.tele -= dt;
        if (s.tele <= 0) {
          s.pending = false;
          fireFrom(s);
        }
      } else {
        s.cool -= dt;
        if (s.cool <= 0) {
          s.cool = fireInterval();
          s.pending = true;
          s.tele = 0.5;
        }
      }
    }

    /* 子弹 */
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.life -= dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 7) b.trail.shift();

      if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
        bullets.splice(i, 1);
        continue;
      }

      let blocked = false;
      for (let k = 0; k < echoes.length; k++) {
        const e = echoes[k];
        const br = b.r + 13;
        if (d2(b.x, b.y, e.x, e.y) < br * br) {
          absorb(b, e);
          blocked = true;
          break;
        }
      }
      if (blocked) { bullets.splice(i, 1); continue; }

      const hr = b.r + player.r;
      if (!pendingHit && player.invuln <= 0 && player.dashT <= 0 &&
          d2(b.x, b.y, player.x, player.y) < hr * hr) {
        pendingHit = true;
      }
    }

    flushPendingHit();
  }

  /* ---------------- 绘制 ---------------- */
  function drawWorld() {
    for (let k = 0; k < echoes.length; k++) {
      const e = echoes[k];
      const p = e.path;
      if (p.length > 1) {
        ctx.beginPath();
        ctx.moveTo(p[0].x, p[0].y);
        for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
        ctx.strokeStyle = 'rgba(110,200,255,0.13)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      const k = 1 - r.life / r.max;
      const rad = lerp(r.r0, r.r1, k);
      ctx.beginPath();
      ctx.arc(r.x, r.y, Math.max(1, rad), 0, TAU);
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = Math.max(0, 1 - k);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (let k = 0; k < echoes.length; k++) {
      const e = echoes[k];
      const fade = clamp(e.life / 1.2, 0, 1);
      glow(SPR.blue, e.x, e.y, 36 + e.flash * 22, 0.5 * fade);
      ctx.beginPath();
      ctx.arc(e.x, e.y, 11, 0, TAU);
      ctx.fillStyle = 'rgba(140,205,255,' + ((0.22 + e.flash * 0.4) * fade) + ')';
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,240,255,' + (0.75 * fade) + ')';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      const fade = clamp(o.life / 1.2, 0, 1);
      const bob = Math.sin(tNow * 3 + o.ph) * 2.5;
      glow(SPR.gold, o.x, o.y + bob, 30, 0.5 * fade);
      ctx.beginPath();
      ctx.arc(o.x, o.y + bob, 5.5, 0, TAU);
      ctx.fillStyle = 'rgba(255,232,175,' + (0.95 * fade) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(o.x, o.y + bob, 9.5, 0, TAU);
      ctx.strokeStyle = 'rgba(255,205,110,' + (0.4 * fade) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    for (let i = 0; i < sentinels.length; i++) {
      const s = sentinels[i];
      const tel = s.pending ? 1 - s.tele / 0.5 : 0;
      glow(SPR.red, s.x, s.y, 24 + tel * 30, 0.3 + tel * 0.45);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 10, 0, TAU);
      ctx.strokeStyle = 'rgba(255,110,140,0.85)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3.5 + tel * 2.5, 0, TAU);
      ctx.fillStyle = 'rgba(255,200,215,0.95)';
      ctx.fill();
      for (let k = 0; k < 3; k++) {
        const a = s.spin + k * (TAU / 3);
        ctx.beginPath();
        ctx.moveTo(s.x + Math.cos(a) * 12, s.y + Math.sin(a) * 12);
        ctx.lineTo(s.x + Math.cos(a) * 16, s.y + Math.sin(a) * 16);
        ctx.strokeStyle = 'rgba(255,120,150,0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      if (b.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(b.trail[0].x, b.trail[0].y);
        for (let k = 1; k < b.trail.length; k++) ctx.lineTo(b.trail[k].x, b.trail[k].y);
        ctx.strokeStyle = 'rgba(255,90,120,0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      glow(SPR.red, b.x, b.y, 18, 0.8);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fillStyle = '#ffe1e8';
      ctx.fill();
    }

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const k = clamp(p.life / p.max, 0, 1);
      glow(p.sprite, p.x, p.y, p.size * 3.2 * k + 1.5, 0.55 * k);
    }

    const blink = player.invuln > 0 && Math.floor(tNow * 18) % 2 === 0;
    if (!blink) {
      glow(SPR.cyan, player.x, player.y, 42, 0.75);
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, TAU);
      ctx.fillStyle = '#eaffff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 3.5, 0, TAU);
      ctx.strokeStyle = 'rgba(120,235,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const ready = clamp(1 - player.dashCD / 1.05, 0, 1);
      if (ready < 1) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r + 9, -Math.PI / 2, -Math.PI / 2 + TAU * ready);
        ctx.strokeStyle = 'rgba(150,220,255,0.28)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    for (let i = 0; i < texts.length; i++) {
      const t = texts[i];
      const k = clamp(t.life / t.max, 0, 1);
      ctx.globalAlpha = k;
      ctx.fillStyle = t.color;
      ctx.font = '700 ' + t.size + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
      ctx.globalAlpha = 1;
    }
  }

  function drawDiamond(x, y, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = color;
    ctx.fillRect(-r * 0.78, -r * 0.78, r * 1.56, r * 1.56);
    ctx.restore();
  }

  function hintAlpha() {
    if (state !== 'playing') return 0;
    return clamp(1 - (elapsed - 12) / 4, 0, 1);
  }

  function drawHUD() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = 'rgba(150,200,230,0.55)';
    ctx.fillText('得分', 28, 34);

    ctx.font = '700 32px ' + FONT;
    ctx.fillStyle = '#eaf8ff';
    ctx.fillText(String(score), 28, 68);

    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = 'rgba(150,200,230,0.42)';
    ctx.fillText('最佳 ' + best, 28, 88);

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(160,210,240,0.5)';
    ctx.font = '600 12px ' + FONT;
    ctx.fillText('WAVE ' + String(wave).padStart(2, '0'), W / 2, 34);

    for (let i = 0; i < hearts; i++) drawDiamond(W - 34 - i * 24, 36, 7, 'rgba(120,235,255,0.95)');

    const bx = 28;
    const by = H - 36;
    const bw = 190;
    const bh = 7;

    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    rrect(bx, by, bw, bh, 3.5);
    ctx.fill();

    const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grd.addColorStop(0, '#5ff0ff');
    grd.addColorStop(1, '#a98bff');

    ctx.save();
    ctx.beginPath();
    ctx.rect(bx, by, bw * charge / 100, bh);
    ctx.clip();
    ctx.fillStyle = chargeFlash > 0 ? 'rgba(255,90,120,0.9)' : grd;
    ctx.fillRect(bx, by, bw, bh);
    ctx.restore();

    const tx = bx + bw * SUMMON_COST / 100;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tx, by - 3);
    ctx.lineTo(tx, by + bh + 3);
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(150,200,230,0.55)';
    ctx.font = '600 11px ' + FONT;
    ctx.fillText('回声能量', bx, by - 9);

    for (let i = 0; i < MAX_ECHO; i++) {
      const cx = bx + bw + 18 + i * 13;
      ctx.beginPath();
      ctx.arc(cx, by + bh / 2, 3.6, 0, TAU);
      if (i < echoes.length) {
        ctx.fillStyle = 'rgba(150,215,255,0.95)';
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(150,200,230,0.28)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    const ha = hintAlpha();
    if (ha > 0 && !isTouch) {
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(150,200,230,' + (0.45 * ha) + ')';
      ctx.font = '600 12px ' + FONT;
      ctx.fillText('空格 召唤回声   ·   Shift 冲刺   ·   P 暂停   ·   M 静音', W - 28, H - 30);
    }

    // 触屏操作提示：开局 5 秒内淡淡显示
    if (isTouch && touchHintT > 0) {
      const ta = clamp(touchHintT / 1.2, 0, 1) * 0.5;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(150,215,245,' + ta + ')';
      ctx.font = '600 13px ' + FONT;
      ctx.fillText('左侧拖动移动 · 右下按钮召唤回声与冲刺', W / 2, H - 24);
    }
  }

  /* ---------------- 触屏操作界面 ---------------- */
  function drawTouchUI() {
    if (!isTouch) return;

    const hasEnergy = charge >= SUMMON_COST;

    // ---- 虚拟摇杆 ----
    // 未触摸时画在左下角固定位置作为"归位点"，触摸时跟到手指处
    const baseX = touch.active ? touch.ox : 118;
    const baseY = touch.active ? touch.oy : H - 118;
    const alpha = touch.active ? 0.5 : 0.22;

    ctx.save();
    // 基座
    ctx.beginPath();
    ctx.arc(baseX, baseY, JOY_RADIUS, 0, TAU);
    ctx.strokeStyle = 'rgba(120,200,255,' + alpha * 0.85 + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(120,200,255,' + alpha * 0.12 + ')';
    ctx.fill();

    // 内圈刻度
    ctx.beginPath();
    ctx.arc(baseX, baseY, JOY_RADIUS * 0.45, 0, TAU);
    ctx.strokeStyle = 'rgba(120,200,255,' + alpha * 0.4 + ')';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 摇杆头
    const hx = touch.active ? touch.cx : baseX;
    const hy = touch.active ? touch.cy : baseY;
    const headR = touch.active ? 26 : 20;
    glow(SPR.cyan, hx, hy, headR * 2.1, touch.active ? 0.5 : 0.16);
    ctx.beginPath();
    ctx.arc(hx, hy, headR, 0, TAU);
    ctx.fillStyle = 'rgba(150,225,255,' + (touch.active ? 0.5 : 0.2) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,240,255,' + (touch.active ? 0.9 : 0.35) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // ---- 按钮 ----
    const btnSummon = BTN.summon;
    const sp = btnPulse.summon;   // 0~1 按下动画
    const sumR = btnSummon.r * (1 + sp * 0.12);
    const sumAlpha = hasEnergy ? 0.42 + sp * 0.4 : 0.16;

    glow(SPR.cyan, btnSummon.x, btnSummon.y, sumR * 1.85, hasEnergy ? 0.35 + sp * 0.35 : 0.08);
    ctx.beginPath();
    ctx.arc(btnSummon.x, btnSummon.y, sumR, 0, TAU);
    ctx.fillStyle = hasEnergy
      ? 'rgba(95,240,255,' + sumAlpha * 0.32 + ')'
      : 'rgba(120,140,160,0.10)';
    ctx.fill();
    ctx.strokeStyle = hasEnergy
      ? 'rgba(140,240,255,' + (0.55 + sp * 0.45) + ')'
      : 'rgba(140,170,190,0.22)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 能量进度环
    ctx.beginPath();
    ctx.arc(btnSummon.x, btnSummon.y, sumR - 6, -Math.PI / 2,
      -Math.PI / 2 + TAU * clamp(charge / 100, 0, 1));
    ctx.strokeStyle = hasEnergy ? 'rgba(200,250,255,0.85)' : 'rgba(150,200,230,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = hasEnergy ? '#eafcff' : 'rgba(200,225,240,0.4)';
    ctx.font = '700 17px ' + FONT;
    ctx.fillText('回声', btnSummon.x, btnSummon.y);

    // 冲刺按钮
    const btnDash = BTN.dash;
    const dp = btnPulse.dash;
    const dashReady = player.dashCD <= 0;
    const dashR = btnDash.r * (1 + dp * 0.12);

    glow(SPR.violet, btnDash.x, btnDash.y, dashR * 1.8, dashReady ? 0.28 : 0.06);
    ctx.beginPath();
    ctx.arc(btnDash.x, btnDash.y, dashR, 0, TAU);
    ctx.fillStyle = dashReady ? 'rgba(175,140,255,0.20)' : 'rgba(120,140,160,0.09)';
    ctx.fill();
    ctx.strokeStyle = dashReady
      ? 'rgba(190,165,255,' + (0.5 + dp * 0.5) + ')'
      : 'rgba(140,170,190,0.2)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 冷却环
    if (!dashReady) {
      ctx.beginPath();
      ctx.arc(btnDash.x, btnDash.y, dashR - 5, -Math.PI / 2,
        -Math.PI / 2 + TAU * clamp(1 - player.dashCD / 1.05, 0, 1));
      ctx.strokeStyle = 'rgba(190,165,255,0.65)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    ctx.fillStyle = dashReady ? '#eee6ff' : 'rgba(200,225,240,0.4)';
    ctx.font = '700 13px ' + FONT;
    ctx.fillText('冲刺', btnDash.x, btnDash.y);
    ctx.textBaseline = 'alphabetic';

    // 全屏按钮（只在支持全屏的浏览器显示）
    if (fsSupported()) {
      const bf = BTN.full;
      const fp = btnPulse.full;
      const on = isFullscreen;
      const fr = bf.r * (1 + fp * 0.12);
      glow(SPR.cyan, bf.x, bf.y, fr * 1.7, 0.16 + fp * 0.2);
      ctx.beginPath();
      ctx.arc(bf.x, bf.y, fr, 0, TAU);
      ctx.fillStyle = 'rgba(10,20,34,0.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,215,245,' + (0.42 + fp * 0.3) + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // 四角图标：全屏时画向内的角，否则向外
      const s = 8;
      const d = on ? s : s * 0.55;
      const c = s * 0.55;
      ctx.beginPath();
      // 左上
      ctx.moveTo(bf.x - d, bf.y - c + (on ? 0 : 0));
      ctx.lineTo(bf.x - d, bf.y - d);
      ctx.lineTo(bf.x - c, bf.y - d);
      // 右上
      ctx.moveTo(bf.x + d, bf.y - c);
      ctx.lineTo(bf.x + d, bf.y - d);
      ctx.lineTo(bf.x + c, bf.y - d);
      // 左下
      ctx.moveTo(bf.x - d, bf.y + c);
      ctx.lineTo(bf.x - d, bf.y + d);
      ctx.lineTo(bf.x - c, bf.y + d);
      // 右下
      ctx.moveTo(bf.x + d, bf.y + c);
      ctx.lineTo(bf.x + d, bf.y + d);
      ctx.lineTo(bf.x + c, bf.y + d);
      ctx.strokeStyle = 'rgba(190,240,255,' + (on ? 0.9 : 0.75) + ')';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
  }

  function drawAnnounce() {
    const a = Math.min(1, announce.life / 0.7) *
      clamp((announce.max - announce.life) / 0.25, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(110,230,255,0.8)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#eafcff';
    ctx.font = '700 46px ' + FONT;
    ctx.fillText(announce.text, W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(180,220,240,0.75)';
    ctx.font = '500 15px ' + FONT;
    ctx.fillText(announce.sub, W / 2, H / 2 - 6);
    ctx.restore();
  }

  function drawTitle() {
    ctx.textAlign = 'center';

    for (let i = 0; i < 3; i++) {
      const k = (tNow * 0.25 + i / 3) % 1;
      ctx.beginPath();
      ctx.arc(W / 2, H * 0.42, 80 + k * 260, 0, TAU);
      ctx.strokeStyle = 'rgba(110,220,255,' + (0.10 * (1 - k)) + ')';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    for (let i = 0; i < 26; i++) {
      const a = i * 2.399 + tNow * 0.12;
      const x = W / 2 + Math.cos(a) * (140 + (i * 37) % 340);
      const y = H / 2 + Math.sin(a * 1.4) * (90 + (i * 53) % 180);
      glow(SPR.cyan, x, y, 26, 0.07);
    }

    ctx.save();
    ctx.shadowColor = 'rgba(110,230,255,0.9)';
    ctx.shadowBlur = 40;
    ctx.fillStyle = '#eafcff';
    ctx.font = '700 86px ' + FONT;
    ctx.fillText('回声', W / 2, 208);
    ctx.restore();

    ctx.font = '600 15px ' + FONT;
    ctx.fillStyle = 'rgba(150,220,255,0.55)';
    ctx.fillText('E  C  H  O', W / 2, 246);

    ctx.font = '500 15px ' + FONT;
    ctx.fillStyle = 'rgba(190,220,240,0.72)';
    ctx.fillText('召唤过去的自己，替你挡下子弹、收集光点', W / 2, 300);

    const rows = isTouch
      ? [
          ['左摇杆', '拖动移动'],
          ['回声 按钮', '召唤回声 · 消耗 28 能量'],
          ['冲刺 按钮', '短暂冲刺 · 无敌'],
          ['右上角', '暂停 / 静音']
        ]
      : [
          ['WASD / 方向键', '移动'],
          ['空格', '召唤回声 · 消耗 28 能量'],
          ['Shift', '短暂冲刺 · 无敌'],
          ['P  /  M', '暂停 / 静音']
        ];
    ctx.font = '500 14px ' + FONT;
    for (let i = 0; i < rows.length; i++) {
      const y = 366 + i * 30;
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(140,235,255,0.85)';
      ctx.fillText(rows[i][0], W / 2 - 16, y);
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(200,225,240,0.6)';
      ctx.fillText(rows[i][1], W / 2 + 16, y);
    }

    if (best > 0) {
      ctx.textAlign = 'center';
      ctx.font = '600 13px ' + FONT;
      ctx.fillStyle = 'rgba(150,200,230,0.45)';
      ctx.fillText('最佳 ' + best, W / 2, 520);
    }

    const a = 0.55 + 0.45 * Math.sin(tNow * 3.2);
    ctx.textAlign = 'center';
    ctx.font = '600 16px ' + FONT;
    ctx.fillStyle = 'rgba(190,245,255,' + a + ')';
    ctx.fillText(isTouch ? '轻触屏幕开始' : '按 空格 开始', W / 2, 560);
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(3,6,12,0.72)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.save();
    ctx.shadowColor = 'rgba(255,90,120,0.6)';
    ctx.shadowBlur = 36;
    ctx.fillStyle = '#ffe9ee';
    ctx.font = '700 54px ' + FONT;
    ctx.fillText('回声散尽', W / 2, 220);
    ctx.restore();

    ctx.fillStyle = 'rgba(150,200,230,0.55)';
    ctx.font = '600 13px ' + FONT;
    ctx.fillText('本次得分', W / 2, 268);

    ctx.fillStyle = '#eaf8ff';
    ctx.font = '700 40px ' + FONT;
    ctx.fillText(String(score), W / 2, 306);

    ctx.fillStyle = 'rgba(190,220,240,0.6)';
    ctx.font = '500 14px ' + FONT;
    ctx.fillText('存活 ' + Math.floor(elapsed) + ' 秒 · 抵达第 ' + wave + ' 波 · 最佳 ' + best, W / 2, 352);

    const a = 0.55 + 0.45 * Math.sin(tNow * 3.2);
    ctx.fillStyle = 'rgba(190,245,255,' + a + ')';
    ctx.font = '600 15px ' + FONT;
    ctx.fillText('按 R 或 空格 再来一次', W / 2, 430);
  }

  function drawPaused() {
    ctx.fillStyle = 'rgba(3,6,12,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#dff6ff';
    ctx.font = '700 34px ' + FONT;
    ctx.fillText('已暂停', W / 2, H / 2 - 6);
    ctx.fillStyle = 'rgba(170,210,235,0.6)';
    ctx.font = '500 14px ' + FONT;
    ctx.fillText('按 P 继续', W / 2, H / 2 + 34);
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
    if (state === 'playing' || state === 'over') drawWorld();
    ctx.restore();

    ctx.drawImage(vig, 0, 0, W, H);

    if (state === 'playing') {
      drawHUD();
      drawTouchUI();
      if (announce) drawAnnounce();
      if (paused) drawPaused();
    } else if (state === 'title') {
      drawTitle();
    } else if (state === 'over') {
      drawOver();
    }
  }

  /* ---------------- 输入 ---------------- */
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    initAudio();
    keys.add(e.code);
    if (e.repeat) return;

    if (e.code === 'KeyM') {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.3;
      return;
    }

    if (state === 'title') {
      if (e.code === 'Space' || e.code === 'Enter') startGame();
      return;
    }
    if (state === 'over') {
      if (e.code === 'KeyR' || e.code === 'Space' || e.code === 'Enter') startGame();
      return;
    }

    if (e.code === 'KeyP' || e.code === 'Escape') {
      paused = !paused;
      return;
    }
    if (e.code === 'Space') summonEcho();
    else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') dash();
  });

  window.addEventListener('keyup', function (e) {
    keys.delete(e.code);
  });

  window.addEventListener('blur', function () {
    keys.clear();
    touch.active = false;
    touch.mag = 0;
    if (state === 'playing') paused = true;
  });

  /* ---------------- 指针 / 触屏输入 ----------------
     一套逻辑同时支持手指和鼠标：
       - 左半屏拖动 = 移动（虚拟摇杆）
       - 点右下「回声」「冲刺」按钮 = 对应操作
       - 标题/结束画面点任意处 = 开始游戏
  ------------------------------------------------ */
  const canvasRect = { left: 0, top: 0, width: W, height: H, scale: 1 };

  function refreshRect() {
    const r = canvas.getBoundingClientRect();
    canvasRect.left = r.left;
    canvasRect.top = r.top;
    canvasRect.width = r.width;
    canvasRect.height = r.height;
    canvasRect.scale = r.width > 0 ? W / r.width : 1;
  }

  // 屏幕坐标 -> 逻辑坐标（960x600 画布空间）
  function toLogical(clientX, clientY) {
    return {
      x: (clientX - canvasRect.left) * canvasRect.scale,
      y: (clientY - canvasRect.top) * canvasRect.scale
    };
  }

  function hitBtn(p, btn) {
    const dx = p.x - btn.x;
    const dy = p.y - btn.y;
    // 触摸目标放宽一点，手指没那么精准
    const r = btn.r * (isTouch ? 1.25 : 1.0);
    return dx * dx + dy * dy <= r * r;
  }

  function onPointerDown(e) {
    initAudio();
    refreshRect();
    const p = toLogical(e.clientX, e.clientY);

    if (state === 'title' || state === 'over') {
      // 手机横屏时，趁这次用户手势直接进全屏（浏览器只允许手势内请求）
      if (isTouch && isLandscapeNow() && !fsBlocked && !fsElement()) {
        enterFullscreen();
      }
      startGame();
      touchHintT = 5;
      return;
    }
    if (state !== 'playing' || paused) return;

    // 先判断按钮
    if (fsSupported() && hitBtn(p, BTN.full)) {
      btnPulse.full = 1;
      toggleFullscreen();
      return;
    }
    if (hitBtn(p, BTN.summon)) {
      btnPulse.summon = 1;
      summonEcho();
      return;
    }
    if (hitBtn(p, BTN.dash)) {
      btnPulse.dash = 1;
      dash();
      return;
    }

    // 其余区域作为摇杆：落在哪就从哪起摇
    touch.active = true;
    touch.pointerId = e.pointerId;
    touch.ox = p.x;
    touch.oy = p.y;
    touch.cx = p.x;
    touch.cy = p.y;
    touch.dx = 0;
    touch.dy = 0;
    touch.mag = 0;

    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!touch.active || e.pointerId !== touch.pointerId) return;
    refreshRect();
    const p = toLogical(e.clientX, e.clientY);

    let dx = p.x - touch.ox;
    let dy = p.y - touch.oy;
    let dist = Math.hypot(dx, dy);

    if (dist > JOY_RADIUS) {
      // 手指超出半径：摇杆基座跟随手指，保持"推到底"的手感
      const k = (dist - JOY_RADIUS) / dist;
      touch.ox += dx * k;
      touch.oy += dy * k;
      dx = p.x - touch.ox;
      dy = p.y - touch.oy;
      dist = Math.hypot(dx, dy) || 1;
    }

    // 方向始终按实际偏移算，幅度限制在 0~1
    touch.dx = dx / dist;
    touch.dy = dy / dist;
    touch.mag = clamp(dist / JOY_RADIUS, 0, 1);

    // 摇杆头画在半径内
    const headDist = Math.min(dist, JOY_RADIUS);
    touch.cx = touch.ox + (dx / dist) * headDist;
    touch.cy = touch.oy + (dy / dist) * headDist;

    e.preventDefault();
  }

  function onPointerUp(e) {
    if (e.pointerId !== touch.pointerId) return;
    touch.active = false;
    touch.pointerId = null;
    touch.mag = 0;
    touch.dx = 0;
    touch.dy = 0;
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
  } else {
    // 老浏览器回退
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchstart', function (e) {
      if (e.touches.length) {
        const t = e.touches[0];
        onPointerDown({ clientX: t.clientX, clientY: t.clientY, pointerId: t.identifier, preventDefault: function () {} });
      }
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      if (e.touches.length) {
        const t = e.touches[0];
        onPointerMove({ clientX: t.clientX, clientY: t.clientY, pointerId: t.identifier, preventDefault: function () {} });
      }
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', function (e) {
      onPointerUp({ pointerId: touch.pointerId });
    });
  }

  // 阻止移动端长按选中/放大/双击缩放
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  canvas.style.touchAction = 'none';

  // 触屏设备检测
  (function detectTouch() {
    const hasTouch = ('ontouchstart' in window) ||
      (navigator && navigator.maxTouchPoints > 0) ||
      (navigator && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || ''));
    isTouch = !!hasTouch;
  })();

  // 竖屏提示：用 JS 判断宽高，横屏必定消失（不依赖 CSS orientation 媒体查询）
  let tipDismissed = false;
  try { tipDismissed = sessionStorage.getItem('echo_rotate_skip') === '1'; } catch (err) { /* 忽略 */ }

  function viewportSize() {
    const vv = window.visualViewport;
    const de = document.documentElement || {};
    const w = Math.round((vv && vv.width) || window.innerWidth || de.clientWidth || 0);
    const h = Math.round((vv && vv.height) || window.innerHeight || de.clientHeight || 0);
    return { w: w, h: h };
  }

  function isLandscapeNow() {
    const s = viewportSize();
    // 宽明显大于高才算横屏，避免地址栏伸缩造成误判
    return s.w > s.h * 1.04;
  }

  function tickOrientation() {
    const land = isLandscapeNow();
    document.body.classList.toggle('landscape-mode', land);
    const showTip = isTouch && !land && !tipDismissed;
    document.body.classList.toggle('tip-on', showTip);
    fit();
  }

  /* ---------------- 全屏 ---------------- */
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement ||
      document.msFullscreenElement || null;
  }

  function fsSupported() {
    const el = document.documentElement;
    return !!(el && (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen));
  }

  function onFsChange() {
    isFullscreen = !!fsElement();
    document.body.classList.toggle('fullscreen-mode', isFullscreen);
    fit();
  }

  function enterFullscreen() {
    if (fsBlocked) return;
    if (!fsSupported()) { fsBlocked = true; return; }
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    try {
      const p = req.call(el, { navigationUI: 'hide' });
      if (p && typeof p.catch === 'function') {
        p.catch(function () { fsBlocked = true; });
      }
    } catch (err) {
      fsBlocked = true;
    }
    // 全屏后尝试锁定横屏（安卓 Chrome 支持，失败无副作用）
    try {
      if (screen.orientation && screen.orientation.lock) {
        const lp = screen.orientation.lock('landscape');
        if (lp && typeof lp.catch === 'function') lp.catch(function () {});
      }
    } catch (err) { /* 忽略 */ }
  }

  function exitFullscreen() {
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    try {
      if (ex) {
        const p = ex.call(document);
        if (p && typeof p.catch === 'function') p.catch(function () {});
      }
    } catch (err) { /* 忽略 */ }
  }

  function toggleFullscreen() {
    if (fsElement()) exitFullscreen();
    else enterFullscreen();
  }

  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('msfullscreenchange', onFsChange);

  (function rotateTip() {
    const skip = document.getElementById('rotate-skip');
    if (skip) {
      skip.addEventListener('click', function (e) {
        e.stopPropagation();
        tipDismissed = true;
        document.body.classList.remove('tip-on');
        try { sessionStorage.setItem('echo_rotate_skip', '1'); } catch (err) { /* 忽略 */ }
        fit();
      });
    }

    // 首次判定 + 旋转后多延迟几次重算（手机旋转时视口尺寸会晚一点稳定）
    tickOrientation();
    [60, 180, 360, 600].forEach(function (ms) { setTimeout(tickOrientation, ms); });

    window.addEventListener('resize', tickOrientation);
    window.addEventListener('orientationchange', function () {
      tickOrientation();
      [100, 250, 500, 800].forEach(function (ms) { setTimeout(tickOrientation, ms); });
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', tickOrientation);
    }
    // 兜底轮询：个别 WebView 旋转时事件不触发，每 700ms 校验一次（开销极小）
    setInterval(tickOrientation, 700);
  })();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') paused = true;
  });

  /* ---------------- 主循环 ---------------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    tNow = now / 1000;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* 供自动化测试读取内部状态（不影响游戏本身） */
  window.__echoDebug = {
    get state() { return state; },
    get player() { return { x: player.x, y: player.y, vx: player.vx, vy: player.vy, dashCD: player.dashCD }; },
    get touch() { return { active: touch.active, dx: touch.dx, dy: touch.dy, mag: touch.mag }; },
    get charge() { return charge; },
    get echoes() { return echoes.length; },
    get isTouch() { return isTouch; },
    get score() { return score; }
  };
})();
</script>
</body>
</html>
